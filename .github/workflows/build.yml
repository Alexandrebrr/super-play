name: Build Super Play
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Structure
        run: |
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/superplay/app/ || true
          [ -f Constants.kt ] && mv Constants.kt app/src/main/java/com/superplay/app/ || true
          [ -f DeviceManager.kt ] && mv DeviceManager.kt app/src/main/java/com/superplay/app/ || true
          python3 -c "
          open('app/src/main/AndroidManifest.xml','w').write('''<?xml version=\"1.0\" encoding=\"utf-8\"?>
          <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">
          <uses-permission android:name=\"android.permission.INTERNET\" />
          <application android:allowBackup=\"true\" android:label=\"Super Play\" android:theme=\"@android:style/Theme.NoTitleBar\">
          <activity android:name=\".MainActivity\" android:exported=\"true\">
          <intent-filter><action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.category.LAUNCHER\" /></intent-filter>
          </activity>
          </application>
          </manifest>''')
          "
          python3 -c "
          open('app/build.gradle','w').write('''plugins { id \"com.android.application\" \n id \"org.jetbrains.kotlin.android\" }\nandroid { namespace \"com.superplay.app\"\n compileSdk 34\n defaultConfig { applicationId \"com.superplay.app\"\n minSdk 21\n targetSdk 34\n versionCode 1\n versionName \"1.0\" }\n buildTypes { release { minifyEnabled false } }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17 } }\ndependencies { implementation \"androidx.core:core-ktx:1.12.0\"\n implementation \"androidx.appcompat:appcompat:1.6.1\"\n implementation \"com.google.android.material:material:1.11.0\" }''')
          "
          echo "include ':app'" > settings.gradle
          touch build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle.zip
         ./gradle-8.7/bin/gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-APK
          path: app/build/outputs/apk/debug/*.apk
