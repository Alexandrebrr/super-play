
name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Play v22 HORIZONTAL FIX TRAVA
        run: |
          rm -rf app build .gradle gradle gradle.zip
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="512dp" android:height="512dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#050E2A" android:pathData="M0,0h512v512h-512z"/>
            <path android:strokeColor="#00FFC8" android:strokeWidth="12" android:pathData="M40,40h432v432h-432z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M100,150h312v180h-312z"/>
            <path android:fillColor="#00FF88" android:pathData="M215,190l0,120l100,-60z"/>
          </vector>
          XML

          cat > app/src/main/res/drawable/bg_space.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:angle="135" android:startColor="#070F2A" android:endColor="#0A1931" android:type="linear"/>
          </shape>
          XML

          cat > gradle.properties <<'PROP'
          android.useAndroidX=true
          android.enableJetifier=true
          PROP

          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.view.View
          import android.content.ClipboardManager
          import android.content.Context
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          import org.json.JSONObject
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.common.MediaItem
          import androidx.media3.ui.PlayerView
          data class Canal(val nome: String, val url: String, val grupo: String, val tipo: String)
          class MainActivity : Activity() {
              private var deviceId = ""
              private var exoPlayer: ExoPlayer? = null
              private lateinit var txtId: TextView
              private lateinit var txtStatus: TextView
              private lateinit var layoutAtivacao: LinearLayout
              private lateinit var layoutMenu: LinearLayout
              private lateinit var layoutLista: LinearLayout
              private lateinit var layoutPlayer: LinearLayout
              private lateinit var txtTituloLista: TextView
              private lateinit var listView: ListView
              private lateinit var playerView: PlayerView
              private var liveGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var moviesGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var seriesGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var currentGruposKeys = listOf<String>()
              private var currentGrupoSelecionado = ""
              private var currentTipo = "LIVE"
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  txtId = findViewById(R.id.txtId)
                  txtStatus = findViewById(R.id.txtStatus)
                  layoutAtivacao = findViewById(R.id.layoutAtivacao)
                  layoutMenu = findViewById(R.id.layoutMenu)
                  layoutLista = findViewById(R.id.layoutLista)
                  layoutPlayer = findViewById(R.id.layoutPlayer)
                  txtTituloLista = findViewById(R.id.txtTituloLista)
                  listView = findViewById(R.id.listView)
                  playerView = findViewById(R.id.playerView)
                  exoPlayer = ExoPlayer.Builder(this).build()
                  playerView.player = exoPlayer
                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!
                  txtId.text = deviceId
                  findViewById<Button>(R.id.btnCopiar).setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID", deviceId))
                      Toast.makeText(this, "ID $deviceId copiado", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btnVerificar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnEntrar).setOnClickListener { abrirMenuDireto() }
                  findViewById<Button>(R.id.btnCanais).setOnClickListener { abrirCategorias("LIVE") }
                  findViewById<Button>(R.id.btnFilmes).setOnClickListener { abrirCategorias("MOVIES") }
                  findViewById<Button>(R.id.btnSeries).setOnClickListener { abrirCategorias("SERIES") }
                  findViewById<Button>(R.id.btnAjustes).setOnClickListener { abrirAjustes() }
                  findViewById<Button>(R.id.btnAtualizar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnSair).setOnClickListener { finish() }
                  findViewById<Button>(R.id.btnVoltarLista).setOnClickListener { voltar() }
                  findViewById<Button>(R.id.btnVoltarPlayer).setOnClickListener { voltar() }
                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (txtTituloLista.text.toString().startsWith("Categorias") || currentTipo=="AJUSTES") {
                          if(currentTipo=="AJUSTES") return@setOnItemClickListener
                          if(pos < currentGruposKeys.size) abrirCanaisDoGrupo(currentGruposKeys[pos])
                      } else {
                          val lista = getCanaisAtuais()
                          if(pos < lista.size) playUrl(lista[pos])
                      }
                  }
                  // Se ja tem playlist salva, ja abre o menu direto
                  prefs.getString("playlist_url", null)?.let {
                      txtStatus.text = "Lista salva encontrada"
                      abrirMenuDireto()
                      carregarM3U(it)
                  }
              }
              fun abrirMenuDireto(){
                  layoutAtivacao.visibility = View.GONE
                  layoutMenu.visibility = View.VISIBLE
                  layoutLista.visibility = View.GONE
                  layoutPlayer.visibility = View.GONE
                  Toast.makeText(this, "Menu aberto - LIVE:${liveGrupos.size} FILMES:${moviesGrupos.size}", Toast.LENGTH_SHORT).show()
              }
              fun verificarAtivacao(){
                  txtStatus.text = "Verificando $deviceId..."
                  thread{
                      try{
                          val url = "https://supplay.online/api/check.php?device_id=$deviceId"
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.connectTimeout=10000; conn.readTimeout=10000
                          conn.setRequestProperty("User-Agent","SuperPlay/1.0")
                          val resp = conn.inputStream.bufferedReader().use{it.readText()}
                          runOnUiThread{
                              try{
                                  val json = JSONObject(resp)
                                  if(json.optString("status")=="active"){
                                      val pl = json.optString("playlist","").replace("\\/", "/")
                                      if(pl.isNotEmpty()){
                                          getSharedPreferences("superplay", MODE_PRIVATE).edit().putString("playlist_url", pl).apply()
                                      }
                                      txtStatus.text="Ativo! Abrindo menu..."
                                      abrirMenuDireto()
                                      if(pl.isNotEmpty()) carregarM3U(pl) else {
                                          txtStatus.text = "Ativo mas sem playlist, clique Atualizar"
                                          Toast.makeText(this, "Ativo! Sem playlist no servidor", Toast.LENGTH_LONG).show()
                                      }
                                  } else {
                                      txtStatus.text="Nao ativado: ${json.optString("status")}"
                                      Toast.makeText(this, "Ative em supplay.online/ativar ID $deviceId", Toast.LENGTH_LONG).show()
                                  }
                              }catch(e:Exception){
                                  txtStatus.text="Erro JSON: ${e.message}"
                                  // Mesmo com erro JSON, abre menu se ja tem lista
                                  if(liveGrupos.isNotEmpty() || getSharedPreferences("superplay", MODE_PRIVATE).getString("playlist_url",null)!=null){
                                      abrirMenuDireto()
                                  }
                              }
                          }
                      }catch(e:Exception){
                          runOnUiThread{
                              txtStatus.text="Erro rede: ${e.message}"
                              // Fallback: abre menu se ja tem algo salvo
                              val saved = getSharedPreferences("superplay", MODE_PRIVATE).getString("playlist_url",null)
                              if(saved!=null){
                                  abrirMenuDireto()
                                  carregarM3U(saved)
                              }
                          }
                      }
                  }
              }
              fun carregarM3U(link: String){
                  txtStatus.text = "Baixando lista..."
                  thread{
                      try{
                          val conn = URL(link).openConnection() as HttpURLConnection
                          conn.connectTimeout=15000; conn.readTimeout=30000
                          conn.setRequestProperty("User-Agent","VLC/3.0.20 LibVLC/3.0.20")
                          conn.setRequestProperty("Accept","*/*")
                          val code = conn.responseCode
                          if(code!=200){
                              throw Exception("HTTP $code")
                          }
                          val txt = conn.inputStream.bufferedReader().use{it.readText()}
                          if(txt.length < 50) throw Exception("M3U vazio")
                          liveGrupos.clear(); moviesGrupos.clear(); seriesGrupos.clear()
                          var nome=""; var grupo="Sem Categoria"
                          var count=0
                          for(l in txt.lines()){
                              val line=l.trim()
                              if(line.startsWith("#EXTINF")){
                                  nome = if(line.contains(",")) line.substringAfterLast(",").trim() else "Canal $count"
                                  grupo = Regex("group-title=\"([^\"]+)\"").find(line)?.groupValues?.get(1) ?: "Sem Categoria"
                                  if(grupo.isBlank()) grupo="Sem Categoria"
                              } else if(line.startsWith("http")){
                                  count++
                                  val tipo = when{
                                      line.contains("/movie/",true) || grupo.lowercase().contains("filme") -> "MOVIES"
                                      line.contains("/series/",true) || grupo.lowercase().contains("serie") -> "SERIES"
                                      else -> "LIVE"
                                  }
                                  val canal = Canal(nome,line,grupo,tipo)
                                  val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                                  if(!mapa.containsKey(grupo)) mapa[grupo]=mutableListOf()
                                  mapa[grupo]?.add(canal)
                              }
                          }
                          runOnUiThread{
                              txtStatus.text="OK! LIVE:${liveGrupos.values.sumOf{it.size}} FILMES:${moviesGrupos.values.sumOf{it.size}} SERIES:${seriesGrupos.values.sumOf{it.size}}"
                              Toast.makeText(this, "Lista carregada: $count canais", Toast.LENGTH_SHORT).show()
                              // Se ja estava na ativacao, abre menu agora
                              if(layoutAtivacao.visibility==View.VISIBLE){
                                  abrirMenuDireto()
                              }
                          }
                      }catch(e:Exception){
                          runOnUiThread{
                              txtStatus.text="Erro M3U: ${e.message} - ${link.take(50)}"
                              Toast.makeText(this, "Erro ao baixar M3U: ${e.message}", Toast.LENGTH_LONG).show()
                              // Mesmo com erro, deixa abrir menu manualmente
                              if(layoutAtivacao.visibility==View.VISIBLE && (liveGrupos.isNotEmpty() || moviesGrupos.isNotEmpty())){
                                  abrirMenuDireto()
                              }
                          }
                      }
                  }
              }
              fun abrirCategorias(tipo: String){
                  currentTipo=tipo
                  val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  if(mapa.isEmpty()){
                      Toast.makeText(this,"Nenhum conteudo $tipo - clique Atualizar",Toast.LENGTH_LONG).show()
                      txtStatus.text = "Vazio $tipo - ${liveGrupos.size} lives salvos"
                      return
                  }
                  currentGruposKeys=mapa.keys.sorted()
                  txtTituloLista.text = when(tipo){"MOVIES"->"Categorias Filmes (${mapa.size})";"SERIES"->"Categorias Series (${mapa.size})";else->"Categorias Ao Vivo (${mapa.size})"}
                  listView.adapter=ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys.map{"${it} (${mapa[it]?.size})"})
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
              }
              fun abrirCanaisDoGrupo(g: String){
                  currentGrupoSelecionado=g
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  val lista=mapa[g]?: emptyList()
                  if(lista.isEmpty()){ Toast.makeText(this,"Grupo vazio",Toast.LENGTH_SHORT).show(); return }
                  txtTituloLista.text="$g - ${lista.size} canais"
                  listView.adapter=ArrayAdapter(this, android.R.layout.simple_list_item_1, lista.map{it.nome})
              }
              fun getCanaisAtuais(): List<Canal>{
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  return mapa[currentGrupoSelecionado]?: emptyList()
              }
              fun playUrl(canal: Canal){
                  layoutLista.visibility=View.GONE
                  layoutPlayer.visibility=View.VISIBLE
                  findViewById<TextView>(R.id.txtTocando).text="Tocando: ${canal.nome}"
                  try{
                      val item = MediaItem.fromUri(canal.url)
                      exoPlayer?.setMediaItem(item)
                      exoPlayer?.prepare()
                      exoPlayer?.playWhenReady=true
                      Toast.makeText(this,"Abrindo ${canal.nome}",Toast.LENGTH_SHORT).show()
                  }catch(e:Exception){ Toast.makeText(this,"Erro player: ${e.message}",Toast.LENGTH_SHORT).show() }
              }
              fun abrirAjustes(){
                  currentTipo="AJUSTES"
                  currentGruposKeys=listOf("ID: $deviceId","LIVE: ${liveGrupos.values.sumOf{it.size}}","FILMES: ${moviesGrupos.values.sumOf{it.size}}","Limpar cache")
                  txtTituloLista.text="Ajustes"
                  listView.adapter=ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys)
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
              }
              fun voltar(){
                  if(layoutPlayer.visibility==View.VISIBLE){ exoPlayer?.stop(); layoutPlayer.visibility=View.GONE; layoutLista.visibility=View.VISIBLE; return }
                  if(layoutLista.visibility==View.VISIBLE){ layoutLista.visibility=View.GONE; layoutMenu.visibility=View.VISIBLE; return }
              }
              override fun onBackPressed() { if(layoutPlayer.visibility==View.VISIBLE || layoutLista.visibility==View.VISIBLE) voltar() else super.onBackPressed() }
              override fun onDestroy() { super.onDestroy(); exoPlayer?.release() }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_space">
              <!-- TELA ATIVACAO - HORIZONTAL TRAVADA -->
              <LinearLayout android:id="@+id/layoutAtivacao" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:gravity="center" android:padding="20dp">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Super Play" android:textColor="#FFF" android:textSize="28sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/txtId" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="XXXX-XXXX" android:textColor="#00FF88" android:textSize="34sp" android:textStyle="bold" android:layout_marginTop="8dp"/>
                      <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="..." android:textColor="#888" android:gravity="center" android:layout_marginTop="12dp"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center" android:padding="16dp">
                      <Button android:id="@+id/btnCopiar" android:layout_width="match_parent" android:layout_height="48dp" android:text="COPIAR ID"/>
                      <Button android:id="@+id/btnVerificar" android:layout_width="match_parent" android:layout_height="52dp" android:text="VERIFICAR" android:backgroundTint="#00FF88" android:textColor="#000" android:layout_marginTop="8dp"/>
                      <Button android:id="@+id/btnEntrar" android:layout_width="match_parent" android:layout_height="48dp" android:text="ENTRAR NO MENU" android:backgroundTint="#1A3A8A" android:textColor="#FFF" android:layout_marginTop="8dp"/>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutMenu" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:padding="12dp">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Super Play v22 HORIZONTAL" android:textColor="#5A6A8A" android:textSize="10sp" android:gravity="end"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal" android:gravity="center">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2" android:orientation="vertical" android:gravity="center">
                          <Button android:id="@+id/btnCanais" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="📺 Canais Ao Vivo" android:textSize="18sp" android:backgroundTint="#1A3A8A" android:layout_margin="4dp"/>
                          <Button android:id="@+id/btnFilmes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="▶ Filmes" android:textSize="18sp" android:layout_margin="4dp"/>
                          <Button android:id="@+id/btnSeries" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="🎬 Séries" android:textSize="18sp" android:layout_margin="4dp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                          <Button android:id="@+id/btnAjustes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="⚙ Ajustes" android:layout_margin="3dp"/>
                          <Button android:id="@+id/btnAtualizar" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="↻ Atualizar" android:layout_margin="3dp"/>
                          <Button android:id="@+id/btnSair" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="⇦ Sair" android:layout_margin="3dp"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutLista" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:background="#0A1931" android:padding="8dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btnVoltarLista" android:layout_width="wrap_content" android:layout_height="36dp" android:text="◀ Voltar"/>
                      <TextView android:id="@+id/txtTituloLista" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Categorias" android:textColor="#FFF" android:textSize="16sp" android:gravity="center"/>
                  </LinearLayout>
                  <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F2240" android:layout_marginTop="8dp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutPlayer" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:background="#000">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="6dp" android:background="#111">
                      <Button android:id="@+id/btnVoltarPlayer" android:layout_width="wrap_content" android:layout_height="32dp" android:text="◀ Voltar"/>
                      <TextView android:id="@+id/txtTocando" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Tocando..." android:textColor="#FFF" android:gravity="center"/>
                  </LinearLayout>
                  <androidx.media3.ui.PlayerView android:id="@+id/playerView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
          </FrameLayout>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Super Play" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:screenOrientation="landscape" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.superplay.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 22
                  versionName "22.0-HORIZONTAL-FIX"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-common:1.2.1'
          }
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build APK v22 HORIZONTAL
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          find . -name "*.apk" -type f -ls
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v22-HORIZONTAL-FIX, path: "**/*.apk" }
