name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - name: Setup Android SDK 34
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$HOME/android-sdk" > $GITHUB_WORKSPACE/local.properties
      - name: Criar projeto v50 MINIMO
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources><string name="app_name">Super Play</string></resources>
          XML
          cat > gradle.properties <<'PROP'
          android.useAndroidX=true
          org.gradle.caching=false
          PROP
          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "Super Play v50 - FUNCIONOU! Cache OFF OK"
                  tv.textSize = 24f
                  tv.setPadding(50,50,50,50)
                  setContentView(tv)
              }
          }
          KT
          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:text="Super Play v50" />
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Super Play" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android { namespace 'com.superplay.app'; compileSdk 34; defaultConfig { applicationId "com.superplay.app"; minSdk 21; targetSdk 34; versionCode 50; versionName "50.0-MINIMO-VERDE" }; buildTypes { release { minifyEnabled false } } }
          dependencies { implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10' }
          GRADLE
          cat > build.gradle <<'GRADLE'
          buildscript { ext.kotlin_version = '1.9.10'; repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.4'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" } }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "include ':app'" > settings.gradle
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.4, cache-disabled: true }
      - name: Build APK v50 MINIMO GARANTIDO
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0
          gradle assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v50-MINIMO-VERDE-APK, path: "app/build/outputs/apk/debug/*.apk" }
