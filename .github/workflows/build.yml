name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Play v8 com Icone e Fundo
        run: |
          rm -rf app build .gradle gradle gradle.zip
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi

          # --- GERA ICONE E FUNDO COM PYTHON (SEM BASE64) ---
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import random, math, os
          # ICONE 512
          size=512
          im=Image.new("RGBA",(size,size),(5,14,42,255))
          draw=ImageDraw.Draw(im)
          # borda neon cyan
          for i in range(8):
              r=size//2 - i
              draw.rounded_rectangle([(i,i),(size-i,size-i)], radius=90-i, outline=(0,255,200, int(255*(1-i/8))), width=2)
          # TV branca
          tv_x0, tv_y0 = 90, 140
          tv_x1, tv_y1 = 422, 380
          draw.rounded_rectangle([(tv_x0,tv_y0),(tv_x1,tv_y1)], radius=30, outline=(255,255,255,255), width=28)
          # base TV
          draw.polygon([(160,380),(352,380),(340,420),(172,420)], fill=(255,255,255,255))
          # play verde neon
          cx, cy = 270, 260
          play = [(210,190),(210,330),(340,260)]
          draw.polygon(play, fill=(0,0,0,0), outline=(0,255,136,255), width=8)
          # glow verde
          for s in range(6,0,-1):
              draw.polygon(play, outline=(0,255,136, int(40*s)), width=s)
          im.save("icon.png")
          # copia para mipmap
          for d in ["app/src/main/res/mipmap-xxxhdpi","app/src/main/res/mipmap-xxhdpi","app/src/main/res/mipmap-xhdpi","app/src/main/res/mipmap-hdpi","app/src/main/res/mipmap-mdpi","app/src/main/res/drawable"]:
              os.makedirs(d, exist_ok=True)
              im.resize((192,192) if "xxx" in d else (144,144) if "xx" in d else (96,96) if "xhdpi" in d and "xx" not in d else (72,72) if "hdpi" in d else (48,48) if "mdpi" in d else (512,512)).save(f"{d}/ic_launcher.png")
          print("icone gerado")
          # FUNDO ESTRELAS
          W,H=1280,720
          bg=Image.new("RGB",(W,H),(7,15,42))
          d=ImageDraw.Draw(bg)
          # estrelas
          for _ in range(400):
              x=random.randint(0,W); y=random.randint(0,H)
              b=random.randint(150,255)
              s=random.randint(1,2)
              d.ellipse([(x,y),(x+s,y+s)], fill=(b,b,255))
          # cometas
          for _ in range(4):
              x0=random.randint(0,W); y0=random.randint(0,H//2)
              x1=x0+random.randint(200,400); y1=y0+random.randint(100,300)
              for i in range(30):
                  t=i/30
                  x=int(x0+(x1-x0)*t); y=int(y0+(y1-y0)*t)
                  a=int(255*(1-t))
                  d.ellipse([(x,y),(x+3,y+3)], fill=(0,200,255,a))
          bg.save("app/src/main/res/drawable/bg_space.jpg","JPEG", quality=85)
          print("fundo gerado")
          PY

          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.view.View
          import android.content.ClipboardManager
          import android.content.Context
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          import org.json.JSONObject
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.common.MediaItem
          import androidx.media3.ui.PlayerView
          data class Canal(val nome: String, val url: String, val grupo: String, val tipo: String)
          class MainActivity : Activity() {
              private var deviceId = ""
              private var exoPlayer: ExoPlayer? = null
              private lateinit var txtId: TextView
              private lateinit var txtStatus: TextView
              private lateinit var layoutAtivacao: LinearLayout
              private lateinit var layoutMenu: LinearLayout
              private lateinit var layoutLista: LinearLayout
              private lateinit var layoutPlayer: LinearLayout
              private lateinit var txtTituloLista: TextView
              private lateinit var listView: ListView
              private lateinit var playerView: PlayerView
              private var todosCanais = mutableListOf<Canal>()
              private var liveGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var moviesGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var seriesGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var navStack = mutableListOf<String>()
              private var currentGruposKeys = listOf<String>()
              private var currentGrupoSelecionado = ""
              private var currentTipo = "LIVE"
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  txtId = findViewById(R.id.txtId)
                  txtStatus = findViewById(R.id.txtStatus)
                  layoutAtivacao = findViewById(R.id.layoutAtivacao)
                  layoutMenu = findViewById(R.id.layoutMenu)
                  layoutLista = findViewById(R.id.layoutLista)
                  layoutPlayer = findViewById(R.id.layoutPlayer)
                  txtTituloLista = findViewById(R.id.txtTituloLista)
                  listView = findViewById(R.id.listView)
                  playerView = findViewById(R.id.playerView)
                  exoPlayer = ExoPlayer.Builder(this).build()
                  playerView.player = exoPlayer
                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!
                  txtId.text = deviceId
                  findViewById<Button>(R.id.btnCopiar).setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID", deviceId))
                      Toast.makeText(this, "ID $deviceId copiado", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btnVerificar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnCanais).setOnClickListener { abrirCategorias("LIVE") }
                  findViewById<Button>(R.id.btnFilmes).setOnClickListener { abrirCategorias("MOVIES") }
                  findViewById<Button>(R.id.btnSeries).setOnClickListener { abrirCategorias("SERIES") }
                  findViewById<Button>(R.id.btnJogos).setOnClickListener { Toast.makeText(this,"Jogos em breve",Toast.LENGTH_SHORT).show() }
                  findViewById<Button>(R.id.btnListas).setOnClickListener { abrirCategorias("LIVE") }
                  findViewById<Button>(R.id.btnAjustes).setOnClickListener { abrirAjustes() }
                  findViewById<Button>(R.id.btnAtualizar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnSair).setOnClickListener { finish() }
                  findViewById<Button>(R.id.btnVoltarLista).setOnClickListener { voltar() }
                  findViewById<Button>(R.id.btnVoltarPlayer).setOnClickListener { voltar() }
                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (txtTituloLista.text.contains("Categoria") || txtTituloLista.text.contains("Ajustes")) {
                          if(currentTipo=="AJUSTES") return@setOnItemClickListener
                          val grupoNome = currentGruposKeys[pos]
                          abrirCanaisDoGrupo(grupoNome)
                      } else {
                          val canal = getCanaisAtuais()[pos]
                          playUrl(canal.nome, canal.url)
                      }
                  }
                  val savedPlaylist = prefs.getString("playlist_url", null)
                  if (savedPlaylist != null) { carregarM3U(savedPlaylist) }
              }
              fun verificarAtivacao(){
                  txtStatus.text = "Verificando $deviceId..."
                  thread{
                      try{
                          val url = "https://supplay.online/api/check.php?device_id=$deviceId"
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.connectTimeout=10000; conn.readTimeout=10000
                          val resp = conn.inputStream.bufferedReader().use{it.readText()}
                          runOnUiThread{
                              try{
                                  val json = JSONObject(resp)
                                  if(json.optString("status")=="active"){
                                      val playlist = json.optString("playlist").replace("\\/", "/")
                                      getSharedPreferences("superplay", MODE_PRIVATE).edit().putString("playlist_url", playlist).apply()
                                      txtStatus.text="Ativo! Baixando grade..."
                                      carregarM3U(playlist)
                                  } else { txtStatus.text="Nao ativado ID $deviceId" }
                              }catch(e:Exception){ txtStatus.text="Erro JSON" }
                          }
                      }catch(e:Exception){ runOnUiThread{ txtStatus.text="Erro rede: ${e.message}" } }
                  }
              }
              fun carregarM3U(link: String){
                  thread{
                      try{
                          val conn = URL(link).openConnection() as HttpURLConnection
                          conn.setRequestProperty("User-Agent","VLC/3.0")
                          conn.connectTimeout=20000; conn.readTimeout=20000
                          val conteudo = conn.inputStream.bufferedReader(Charsets.UTF_8).use{it.readText()}
                          todosCanais.clear(); liveGrupos.clear(); moviesGrupos.clear(); seriesGrupos.clear()
                          var nomeAtual=""; var grupoAtual=""
                          for(linhaRaw in conteudo.lines()){
                              val l = linhaRaw.trim()
                              if(l.startsWith("#EXTINF")){
                                  nomeAtual = if(l.contains(",")) l.substringAfterLast(",").trim() else "Canal"
                                  val g = Regex("group-title=\"([^\"]+)\"").find(l)
                                  grupoAtual = g?.groupValues?.get(1) ?: "Sem Categoria"
                              } else if(l.isNotEmpty() && !l.startsWith("#") && l.startsWith("http")){
                                  if(nomeAtual.isEmpty()) nomeAtual="Canal"
                                  val tipo = when{
                                      l.contains("/movie/",true) || grupoAtual.lowercase().contains("filme") || grupoAtual.lowercase().contains("movie") -> "MOVIES"
                                      l.contains("/series/",true) || grupoAtual.lowercase().contains("serie") -> "SERIES"
                                      else -> "LIVE"
                                  }
                                  val canal = Canal(nomeAtual,l,grupoAtual,tipo)
                                  todosCanais.add(canal)
                                  val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                                  if(!mapa.containsKey(grupoAtual)) mapa[grupoAtual]=mutableListOf()
                                  mapa[grupoAtual]?.add(canal)
                                  nomeAtual=""; grupoAtual=""
                              }
                          }
                          runOnUiThread{
                              layoutAtivacao.visibility=View.GONE
                              layoutMenu.visibility=View.VISIBLE
                              txtStatus.text="LIVE:${liveGrupos.size} FILMES:${moviesGrupos.size} SERIES:${seriesGrupos.size}"
                          }
                      }catch(e:Exception){ runOnUiThread{ txtStatus.text="Erro M3U: ${e.message}" } }
                  }
              }
              fun abrirCategorias(tipo: String){
                  currentTipo=tipo
                  val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  if(mapa.isEmpty()){ Toast.makeText(this,"Vazio $tipo",Toast.LENGTH_SHORT).show(); return }
                  currentGruposKeys = mapa.keys.sorted()
                  txtTituloLista.text = when(tipo){"MOVIES"->"Categorias Filmes";"SERIES"->"Categorias Series";else->"Categorias Ao Vivo"}
                  listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys.map{"${it} (${mapa[it]?.size})"})
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
                  navStack.add("MENU")
              }
              fun abrirCanaisDoGrupo(grupo: String){
                  currentGrupoSelecionado=grupo
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  val canais = mapa[grupo] ?: mutableListOf()
                  txtTituloLista.text = "$grupo - ${canais.size}"
                  listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, canais.map{it.nome})
                  navStack.add("CAT:$grupo")
              }
              fun getCanaisAtuais(): List<Canal>{
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  return mapa[currentGrupoSelecionado] ?: emptyList()
              }
              fun playUrl(nome: String, url: String){
                  layoutLista.visibility=View.GONE
                  layoutPlayer.visibility=View.VISIBLE
                  findViewById<TextView>(R.id.txtTocando).text="Tocando: $nome"
                  navStack.add("CANAL")
                  try{
                      val item = MediaItem.fromUri(url)
                      exoPlayer?.setMediaItem(item)
                      exoPlayer?.prepare()
                      exoPlayer?.playWhenReady=true
                  }catch(e:Exception){ Toast.makeText(this,"Erro: ${e.message}",Toast.LENGTH_SHORT).show() }
              }
              fun abrirAjustes(){
                  currentTipo="AJUSTES"
                  currentGruposKeys = listOf("Controle dos pais","Ocultar categorias ao vivo","Ocultar categorias Vod","Ocultar categorias series","Limpar historico","Atualizar agora")
                  txtTituloLista.text="Ajustes"
                  listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys)
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
                  navStack.add("MENU")
              }
              fun voltar(){
                  if(layoutPlayer.visibility==View.VISIBLE){
                      exoPlayer?.stop()
                      layoutPlayer.visibility=View.GONE
                      layoutLista.visibility=View.VISIBLE
                      if(navStack.isNotEmpty()) navStack.removeAt(navStack.size-1)
                      return
                  }
                  if(layoutLista.visibility==View.VISIBLE){
                      if(navStack.isNotEmpty()){
                          val last = navStack.removeAt(navStack.size-1)
                          if(last.startsWith("CAT:")){ abrirCategorias(currentTipo); navStack.removeAt(navStack.size-1); return }
                      }
                      layoutLista.visibility=View.GONE
                      layoutMenu.visibility=View.VISIBLE
                      return
                  }
              }
              override fun onBackPressed() { if(layoutPlayer.visibility==View.VISIBLE || layoutLista.visibility==View.VISIBLE) voltar() else super.onBackPressed() }
              override fun onDestroy() { super.onDestroy(); exoPlayer?.release() }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:background="@drawable/bg_space">
              <LinearLayout android:id="@+id/layoutAtivacao"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:orientation="vertical" android:gravity="center" android:padding="24dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Super Play" android:textColor="#FFF" android:textSize="28sp" android:textStyle="bold"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ID DA SUA TV" android:textColor="#888" android:textSize="11sp" android:layout_marginTop="20dp"/>
                  <TextView android:id="@+id/txtId" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="XXXX-XXXX" android:textColor="#00FF88" android:textSize="36sp" android:textStyle="bold"/>
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="www.supplay.online/ativar" android:textColor="#FFF" android:textSize="14sp" android:textStyle="bold" android:layout_marginBottom="16dp"/>
                  <Button android:id="@+id/btnCopiar" android:layout_width="match_parent" android:layout_height="48dp" android:text="COPIAR ID"/>
                  <Button android:id="@+id/btnVerificar" android:layout_width="match_parent" android:layout_height="52dp" android:text="VERIFICAR" android:backgroundTint="#00FF88" android:textColor="#000" android:layout_marginTop="8dp"/>
                  <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Aguardando..." android:textColor="#888" android:textSize="11sp" android:gravity="center" android:layout_marginTop="12dp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutMenu"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:orientation="vertical" android:visibility="gone" android:padding="16dp">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Super Play v8" android:textColor="#5A6A8A" android:textSize="10sp" android:gravity="end"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal" android:gravity="center" android:layout_marginTop="20dp">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2" android:orientation="vertical">
                          <Button android:id="@+id/btnCanais" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="📺&#10;Canais" android:textSize="18sp" android:backgroundTint="#1A3A8A" android:layout_margin="4dp"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
                              <Button android:id="@+id/btnJogos" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="⚽&#10;JOGOS" android:textSize="11sp" android:backgroundTint="#1A2A6A" android:layout_margin="4dp"/>
                              <Button android:id="@+id/btnListas" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:text="👥&#10;Listas" android:textSize="11sp" android:backgroundTint="#1A2A6A" android:layout_margin="4dp"/>
                          </LinearLayout>
                      </LinearLayout>
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical">
                          <Button android:id="@+id/btnFilmes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="▶&#10;Filmes" android:textSize="12sp" android:backgroundTint="#1A2A6A" android:layout_margin="4dp"/>
                          <Button android:id="@+id/btnSeries" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="🎬&#10;Series" android:textSize="12sp" android:backgroundTint="#1A2A6A" android:layout_margin="4dp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical">
                          <Button android:id="@+id/btnAjustes" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⚙ Ajustes" android:textSize="10sp" android:backgroundTint="#1C2C4A" android:layout_margin="2dp"/>
                          <Button android:id="@+id/btnAtualizar" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="↻ Atualizar" android:textSize="10sp" android:backgroundTint="#1C2C4A" android:layout_margin="2dp"/>
                          <Button android:id="@+id/btnSair" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="⇦ Sair" android:textSize="10sp" android:backgroundTint="#1C2C4A" android:layout_margin="2dp"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutLista"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:orientation="vertical" android:visibility="gone" android:background="#0A1931" android:padding="8dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btnVoltarLista" android:layout_width="wrap_content" android:layout_height="36dp" android:text="◀ Voltar"/>
                      <TextView android:id="@+id/txtTituloLista" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Categorias" android:textColor="#FFF" android:textSize="16sp" android:textStyle="bold" android:gravity="center"/>
                  </LinearLayout>
                  <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#0F2240" android:divider="#1A3A6A" android:dividerHeight="1dp" android:layout_marginTop="8dp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutPlayer"
                  android:layout_width="match_parent" android:layout_height="match_parent"
                  android:orientation="vertical" android:visibility="gone" android:background="#000">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="6dp" android:background="#111">
                      <Button android:id="@+id/btnVoltarPlayer" android:layout_width="wrap_content" android:layout_height="32dp" android:text="◀ Voltar"/>
                      <TextView android:id="@+id/txtTocando" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Tocando..." android:textColor="#FFF" android:textSize="12sp" android:gravity="center"/>
                  </LinearLayout>
                  <androidx.media3.ui.PlayerView android:id="@+id/playerView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
          </FrameLayout>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Super Play" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:configChanges="orientation|keyboardHidden|screenSize">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdkVersion 34
              defaultConfig { applicationId "com.superplay.app" minSdkVersion 24 targetSdkVersion 34 versionCode 8 versionName "8.0-ICON-FUNDO" }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-common:1.2.1'
          }
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.0'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Build APK v8
        run: |
          pip3 install pillow -q
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle.zip
          ./gradle-8.2/bin/gradle assembleDebug --stacktrace
          find . -name "*.apk" -type f -ls
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v8-ICON-FUNDO, path: "**/*.apk" }
