name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Super Play NATIVO CERTIFICADO - So ID na TV - MINIMO GARANTIDO
        run: |
          rm -rf app build .gradle gradle gradle.zip
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout

          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          import android.widget.Button
          import android.widget.Toast
          import android.content.ClipboardManager
          import android.content.Context
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          class MainActivity : Activity() {
              private var deviceId: String = ""
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  val txtId = findViewById<TextView>(R.id.txtId)
                  val btnCopiar = findViewById<Button>(R.id.btnCopiar)
                  val btnVerificar = findViewById<Button>(R.id.btnVerificar)
                  val txtStatus = findViewById<TextView>(R.id.txtStatus)
                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!
                  txtId.text = deviceId
                  txtStatus.text = "Acesse supplay.online e digite o ID $deviceId"
                  btnCopiar.setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID TV", deviceId))
                      Toast.makeText(this, "ID $deviceId copiado", Toast.LENGTH_SHORT).show()
                  }
                  btnVerificar.setOnClickListener {
                      txtStatus.text = "Verificando $deviceId..."
                      btnVerificar.isEnabled = false
                      thread {
                          try {
                              val fullUrl = "https://supplay.online/api/check.php?device_id=" + deviceId
                              val conn = URL(fullUrl).openConnection() as HttpURLConnection
                              conn.connectTimeout = 10000
                              conn.readTimeout = 10000
                              conn.requestMethod = "GET"
                              val code = conn.responseCode
                              val resp = try { conn.inputStream.bufferedReader().use { it.readText() } } catch (e: Exception) { conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "" }
                              runOnUiThread {
                                  if (code == 200 && resp.contains("http")) { txtStatus.text = "ATIVO! Playlist: " + resp } 
                                  else if (resp.contains("not_active")) { txtStatus.text = "Ainda nao ativado. Ative em supplay.online com ID $deviceId" } 
                                  else { txtStatus.text = "Nao ativado. Acesse supplay.online ID $deviceId" }
                                  btnVerificar.isEnabled = true
                              }
                          } catch (e: Exception) {
                              runOnUiThread { txtStatus.text = "Erro: " + e.message; btnVerificar.isEnabled = true }
                          }
                      }
                  }
              }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#0A0A0A"
              android:padding="24dp"
              android:gravity="center">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Super Play" android:textColor="#FFFFFF" android:textSize="28sp" android:textStyle="bold" android:layout_marginBottom="30dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ID DA SUA TV" android:textColor="#888888" android:textSize="12sp"/>
              <TextView android:id="@+id/txtId" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="A1B2-C3D4" android:textColor="#00FF88" android:textSize="40sp" android:textStyle="bold" android:layout_marginTop="8dp" android:layout_marginBottom="20dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="www.supplay.online/ativar" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" android:layout_marginBottom="20dp"/>
              <Button android:id="@+id/btnCopiar" android:layout_width="match_parent" android:layout_height="50dp" android:text="COPIAR ID" android:layout_marginBottom="12dp"/>
              <Button android:id="@+id/btnVerificar" android:layout_width="match_parent" android:layout_height="56dp" android:text="VERIFICAR ATIVAÇÃO" android:backgroundTint="#00FF88" android:textColor="#000000"/>
              <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Aguardando..." android:textColor="#888888" android:textSize="12sp" android:gravity="center" android:layout_marginTop="20dp"/>
          </LinearLayout>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Super Play" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.superplay.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 4
                  versionName "4.0-MINIMO"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          }
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK MINIMO
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle.zip
          ./gradle-8.0/bin/gradle assembleDebug --stacktrace
          find . -name "*.apk" -type f -ls

      - uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-ID-VERDE
          path: "**/*.apk"
