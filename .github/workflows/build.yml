name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Criar projeto v48 VOLTA V28 QUE DEU VERDE
        run: |
          rm -rf app build .gradle gradle
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'XML'
          <resources><string name="app_name">Super Play</string></resources>
          XML
          cat > app/src/main/res/values/colors.xml <<'XML'
          <resources><color name="bg">#0A1931</color></resources>
          XML
          cat > gradle.properties <<'PROP'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          PROP
          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.view.View
          import android.content.ClipboardManager
          import android.content.Context
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          import org.json.JSONObject
          data class Canal(val nome: String, val url: String, val grupo: String, val tipo: String)
          class MainActivity : Activity() {
              private var deviceId = ""
              private lateinit var txtId: TextView
              private lateinit var txtStatus: TextView
              private lateinit var txtStatusMenu: TextView
              private lateinit var layoutAtivacao: LinearLayout
              private lateinit var layoutMenu: LinearLayout
              private lateinit var layoutLista: LinearLayout
              private lateinit var layoutPlayer: LinearLayout
              private lateinit var txtTituloLista: TextView
              private lateinit var listView: ListView
              private lateinit var videoView: VideoView
              private lateinit var edtBusca: EditText
              private var liveGrupos = linkedMapOf<String, MutableList<Canal>>()
              private var moviesGrupos = linkedMapOf<String, MutableList<Canal>>()
              private var seriesGrupos = linkedMapOf<String, MutableList<Canal>>()
              private var liveOrder = mutableListOf<String>()
              private var moviesOrder = mutableListOf<String>()
              private var seriesOrder = mutableListOf<String>()
              private var currentGruposKeys = listOf<String>()
              private var currentGrupoSelecionado = ""
              private var currentTipo = "LIVE"
              private var lastPlaylistUrl = ""
              private var listaCanaisFull = listOf<Canal>()
              private var listaCatsFull = listOf<String>()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  txtId = findViewById(R.id.txtId)
                  txtStatus = findViewById(R.id.txtStatus)
                  txtStatusMenu = findViewById(R.id.txtStatusMenu)
                  layoutAtivacao = findViewById(R.id.layoutAtivacao)
                  layoutMenu = findViewById(R.id.layoutMenu)
                  layoutLista = findViewById(R.id.layoutLista)
                  layoutPlayer = findViewById(R.id.layoutPlayer)
                  txtTituloLista = findViewById(R.id.txtTituloLista)
                  listView = findViewById(R.id.listView)
                  videoView = findViewById(R.id.playerView)
                  edtBusca = findViewById(R.id.edtBusca)
                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!
                  txtId.text = deviceId
                  lastPlaylistUrl = prefs.getString("playlist_url", "") ?: ""
                  findViewById<Button>(R.id.btnCopiar).setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID", deviceId))
                      Toast.makeText(this, "ID copiado", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btnVerificar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnEntrar).setOnClickListener { abrirMenuDireto() }
                  findViewById<Button>(R.id.btnCanais).setOnClickListener { abrirCategorias("LIVE") }
                  findViewById<Button>(R.id.btnFilmes).setOnClickListener { abrirCategorias("MOVIES") }
                  findViewById<Button>(R.id.btnSeries).setOnClickListener { abrirCategorias("SERIES") }
                  findViewById<Button>(R.id.btnAjustes).setOnClickListener { abrirAjustes() }
                  findViewById<Button>(R.id.btnAtualizar).setOnClickListener { if(lastPlaylistUrl.isNotEmpty()) carregarM3U(lastPlaylistUrl) else verificarAtivacao() }
                  findViewById<Button>(R.id.btnSair).setOnClickListener { voltarParaAtivacao() }
                  findViewById<Button>(R.id.btnVoltarLista).setOnClickListener { voltar() }
                  findViewById<Button>(R.id.btnVoltarPlayer).setOnClickListener { minimizarPlayer() }
                  findViewById<Button>(R.id.btnLimparBusca).setOnClickListener { edtBusca.setText("") }
                  edtBusca.addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: android.text.Editable?) { filtrar(s.toString()) }
                  })
                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (txtTituloLista.text.toString().startsWith("Categorias") || currentTipo=="AJUSTES") {
                          if(currentTipo=="AJUSTES" && pos==4){ prefs.edit().remove("playlist_url").apply(); voltarParaAtivacao(); return@setOnItemClickListener }
                          if(pos < currentGruposKeys.size) abrirCanaisDoGrupo(currentGruposKeys[pos])
                      } else {
                          val lista = getListaVisivel()
                          if(pos < lista.size) playFullscreen(lista[pos])
                      }
                  }
                  if(lastPlaylistUrl.isNotEmpty()){ abrirMenuDireto(); carregarM3U(lastPlaylistUrl) }
              }
              fun getAttr(line: String, attr: String): String { val idx = line.indexOf(attr + "="); if(idx==-1) return ""; var start = idx + attr.length + 1; if(start >= line.length) return ""; val q = line[start]; if(q == '"' || q.code == 39){ start++; val end = line.indexOf(q, start); if(end!=-1) return line.substring(start, end) } else { var end = line.indexOf(' ', start); if(end==-1) end=line.length; return line.substring(start, end) }; return "" }
              fun filtrar(query: String){ val q = query.trim().lowercase(); if(q.isEmpty()){ if(txtTituloLista.text.toString().startsWith("Categorias")){ currentGruposKeys = listaCatsFull; val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}; listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys.map{it + " (" + (mapa[it]?.size ?: 0) + ")"}); txtTituloLista.text = "Categorias - " + currentGruposKeys.size + " (TUDO)" } else { listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, listaCanaisFull.map{it.nome}); txtTituloLista.text = currentGrupoSelecionado + " - " + listaCanaisFull.size + " (TUDO)" }; return }; if(txtTituloLista.text.toString().startsWith("Categorias")){ val filtrado = listaCatsFull.filter{ it.lowercase().contains(q) }; currentGruposKeys = filtrado; val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}; listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, filtrado.map{it + " (" + (mapa[it]?.size ?: 0) + ")"}); txtTituloLista.text = "Busca: " + query + " - " + filtrado.size } else { val filtrado = listaCanaisFull.filter{ it.nome.lowercase().contains(q) }; listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, filtrado.map{it.nome}); txtTituloLista.text = "Busca: " + query + " - " + filtrado.size } }
              fun getListaVisivel(): List<Canal>{ val q = edtBusca.text.toString().trim().lowercase(); if(q.isEmpty()) return listaCanaisFull; return listaCanaisFull.filter{ it.nome.lowercase().contains(q) } }
              fun voltarParaAtivacao(){ layoutMenu.visibility = View.GONE; layoutLista.visibility = View.GONE; layoutPlayer.visibility = View.GONE; layoutAtivacao.visibility = View.VISIBLE; videoView.stopPlayback(); window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE }
              fun abrirMenuDireto(){ layoutAtivacao.visibility = View.GONE; layoutMenu.visibility = View.VISIBLE; layoutLista.visibility = View.GONE; layoutPlayer.visibility = View.GONE; txtStatusMenu.text = "LIVE:" + liveGrupos.values.sumOf{it.size} + " FIL:" + moviesGrupos.values.sumOf{it.size} + " SER:" + seriesGrupos.values.sumOf{it.size} }
              fun verificarAtivacao(){ txtStatus.text = "Verificando..."; thread{ try{ val url = "https://supplay.online/api/check.php?device_id=$deviceId"; val conn = URL(url).openConnection() as HttpURLConnection; conn.connectTimeout=12000; conn.readTimeout=12000; val resp = conn.inputStream.bufferedReader().use{it.readText()}; runOnUiThread{ try{ val json = JSONObject(resp); if(json.optString("status")=="active"){ var pl = json.optString("playlist",""); if(pl.isEmpty()) pl = json.optString("url",""); if(pl.isNotEmpty()){ lastPlaylistUrl = pl; getSharedPreferences("superplay", MODE_PRIVATE).edit().putString("playlist_url", pl).apply(); abrirMenuDireto(); carregarM3U(pl) } else { txtStatus.text="Ativo sem link"; abrirMenuDireto() } } else { txtStatus.text="Nao ativo" } }catch(e:Exception){ txtStatus.text="Erro JSON" } } }catch(e:Exception){ runOnUiThread{ txtStatus.text="Erro rede" } } } }
              fun carregarM3U(link: String){ if(link.isBlank()) return; txtStatusMenu.text = "Carregando a lista... aguarde"; thread{ var total=0; var reader: java.io.BufferedReader? = null; try{ val conn = URL(link).openConnection() as HttpURLConnection; conn.connectTimeout=20000; conn.readTimeout=60000; conn.setRequestProperty("User-Agent","VLC"); if(conn.responseCode!=200) throw Exception("HTTP " + conn.responseCode); reader = conn.inputStream.bufferedReader(); liveGrupos.clear(); moviesGrupos.clear(); seriesGrupos.clear(); liveOrder.clear(); moviesOrder.clear(); seriesOrder.clear(); var nome="Canal"; var grupo="Sem Categoria"; var line: String?; while(true){ try{ line = reader.readLine() ?: break } catch(e:Exception){ break }; val t = line!!.trim(); if(t.isEmpty()) continue; if(t.startsWith("#EXTINF")){ try{ nome = if(t.contains(",")) t.substringAfterLast(",").trim() else "Canal"; grupo = getAttr(t, "group-title"); if(grupo.isEmpty()) grupo="Sem Categoria" }catch(e:Exception){} } else if(t.startsWith("http")){ total++; val gl = grupo.lowercase(); val ll = t.lowercase(); val tipo = when{ gl.contains("filme") || gl.contains("movie") || ll.contains("/movie/") -> "MOVIES"; gl.contains("serie") || ll.contains("/series/") -> "SERIES"; else -> "LIVE" }; val canal = Canal(nome, t, grupo, tipo); val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}; val order = when(tipo){"MOVIES"->moviesOrder;"SERIES"->seriesOrder;else->liveOrder}; if(!mapa.containsKey(grupo)){ mapa[grupo]=mutableListOf(); order.add(grupo) }; mapa[grupo]?.add(canal); if(total % 500 == 0){ val tt=total; runOnUiThread{ txtStatusMenu.text="Carregando a lista... " + tt } }; nome="Canal"; grupo="Sem Categoria" } }; reader.close(); runOnUiThread{ val lc = liveGrupos.values.sumOf{it.size}; val mc = moviesGrupos.values.sumOf{it.size}; val sc = seriesGrupos.values.sumOf{it.size}; txtStatusMenu.text="OK! LIVE:" + lc + " FIL:" + mc + " SER:" + sc + " TOTAL:" + total + " (TUDO)"; Toast.makeText(this, "TUDO " + total, Toast.LENGTH_LONG).show(); if(layoutAtivacao.visibility==View.VISIBLE) abrirMenuDireto() } }catch(e:Exception){ try{ reader?.close() } catch(ex:Exception){}; runOnUiThread{ txtStatusMenu.text="Erro: " + e.message } } } }
              fun abrirCategorias(tipo: String){ currentTipo=tipo; edtBusca.setText(""); val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}; val order = when(tipo){"MOVIES"->moviesOrder;"SERIES"->seriesOrder;else->liveOrder}; if(mapa.isEmpty()){ Toast.makeText(this,"Vazio " + tipo,Toast.LENGTH_LONG).show(); return }; currentGruposKeys = if(order.isNotEmpty()) order else mapa.keys.toList(); listaCatsFull = currentGruposKeys; txtTituloLista.text="Categorias - " + currentGruposKeys.size + " (TUDO)"; listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys.map{it + " (" + (mapa[it]?.size ?: 0) + ")"}); layoutMenu.visibility=View.GONE; layoutLista.visibility=View.VISIBLE }
              fun abrirCanaisDoGrupo(g: String){ currentGrupoSelecionado=g; edtBusca.setText(""); val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}; val lista=mapa[g]?: emptyList(); listaCanaisFull = lista; txtTituloLista.text=g + " - " + lista.size + " (TUDO)"; listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, lista.map{it.nome}) }
              fun playFullscreen(canal: Canal){ layoutLista.visibility=View.GONE; layoutMenu.visibility=View.GONE; layoutPlayer.visibility=View.VISIBLE; window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION); findViewById<TextView>(R.id.txtTocando).text=canal.nome; try{ videoView.setVideoPath(canal.url); videoView.start() }catch(e:Exception){} }
              fun minimizarPlayer(){ videoView.stopPlayback(); window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON); window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE; layoutPlayer.visibility=View.GONE; layoutLista.visibility=View.VISIBLE }
              fun abrirAjustes(){ currentTipo="AJUSTES"; edtBusca.setText(""); val lc = liveGrupos.values.sumOf{it.size}; val mc = moviesGrupos.values.sumOf{it.size}; val sc = seriesGrupos.values.sumOf{it.size}; currentGruposKeys=listOf("ID " + deviceId,"LIVE " + lc,"FILMES " + mc,"SERIES " + sc,"Limpar cache"); listaCatsFull=currentGruposKeys; txtTituloLista.text="Ajustes v48"; listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys); layoutMenu.visibility=View.GONE; layoutLista.visibility=View.VISIBLE }
              fun voltar(){ if(layoutPlayer.visibility==View.VISIBLE){ minimizarPlayer(); return }; if(layoutLista.visibility==View.VISIBLE){ layoutLista.visibility=View.GONE; layoutMenu.visibility=View.VISIBLE; return } }
              override fun onBackPressed() { voltar() }
          }
          KT
          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0A1931">
              <LinearLayout android:id="@+id/layoutAtivacao" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:gravity="center" android:padding="20dp">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                      <TextView android:text="Super Play" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="28sp"/>
                      <TextView android:id="@+id/txtId" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="XXXX" android:textColor="#00FF88" android:textSize="24sp"/>
                      <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Status" android:textColor="#888888" android:gravity="center"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                      <Button android:id="@+id/btnCopiar" android:layout_width="match_parent" android:layout_height="48dp" android:text="COPIAR ID"/>
                      <Button android:id="@+id/btnVerificar" android:layout_width="match_parent" android:layout_height="48dp" android:text="VERIFICAR" android:layout_marginTop="8dp"/>
                      <Button android:id="@+id/btnEntrar" android:layout_width="match_parent" android:layout_height="48dp" android:text="ENTRAR" android:layout_marginTop="8dp"/>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutMenu" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:padding="8dp">
                  <TextView android:id="@+id/txtStatusMenu" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Carregando a lista..." android:textColor="#00FF88" android:textSize="12sp" android:gravity="center"/>
                  <Button android:id="@+id/btnCanais" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Canais" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnFilmes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Filmes" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnSeries" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Series" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnAjustes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Ajustes" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnAtualizar" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Atualizar" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnSair" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Sair" android:layout_margin="4dp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutLista" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:padding="8dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btnVoltarLista" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Voltar"/>
                      <TextView android:id="@+id/txtTituloLista" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Categorias" android:textColor="#FFFFFF" android:gravity="center"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="4dp" android:layout_marginTop="6dp">
                      <EditText android:id="@+id/edtBusca" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1" android:hint="Buscar canal, filme, serie..."/>
                      <Button android:id="@+id/btnLimparBusca" android:layout_width="wrap_content" android:layout_height="40dp" android:text="X"/>
                  </LinearLayout>
                  <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:layout_marginTop="6dp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutPlayer" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:background="#000000">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btnVoltarPlayer" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Voltar"/>
                      <TextView android:id="@+id/txtTocando" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Tocando" android:textColor="#FFFFFF" android:gravity="center"/>
                  </LinearLayout>
                  <VideoView android:id="@+id/playerView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
          </LinearLayout>
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Super Play" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdk 34
              defaultConfig { applicationId "com.superplay.app"; minSdk 21; targetSdk 34; versionCode 48; versionName "48.0-V28-REAL" }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10' }
          GRADLE
          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.4'; classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version" }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "include ':app'" > settings.gradle
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - name: Build APK v48 VOLTA V28 VERDE
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          ls -lh app/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v48-V28-VERDE, path: "app/build/outputs/apk/debug/*.apk" }
