name: Build Super Play
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip if zip uploaded
        run: |
          ls -la
          find . -maxdepth 3 -name "*.zip" -print || true
          for z in $(find . -maxdepth 3 -name "*.zip" 2>/dev/null); do
            echo "Unzipping $z"
            unzip -o "$z" -d . || true
          done
          rm -f *.zip || true
          for d in PACOTE-2-APP-FINAL-CORRIGIDO final_build PACOTE-2-APP-FINAL-CORRIGIDO-main; do
            if [ -d "$d" ]; then
              echo "Moving $d"
              cp -rf $d/. . || true
            fi
          done
          ls -la
          ls -la app || true
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          else
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle.zip
            ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
