
name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Play v16 VIDEOVIEW MINIMAL
        run: |
          rm -rf app build .gradle gradle gradle.zip
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout

          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.view.View
          import android.content.ClipboardManager
          import android.content.Context
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          import org.json.JSONObject
          data class Canal(val nome: String, val url: String, val grupo: String, val tipo: String)
          class MainActivity : Activity() {
              private var deviceId = ""
              private lateinit var txtId: TextView
              private lateinit var txtStatus: TextView
              private lateinit var layoutAtivacao: LinearLayout
              private lateinit var layoutMenu: LinearLayout
              private lateinit var layoutLista: LinearLayout
              private lateinit var layoutPlayer: LinearLayout
              private lateinit var txtTituloLista: TextView
              private lateinit var listView: ListView
              private lateinit var videoView: VideoView
              private var todosCanais = mutableListOf<Canal>()
              private var liveGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var moviesGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var seriesGrupos = mutableMapOf<String, MutableList<Canal>>()
              private var currentGruposKeys = listOf<String>()
              private var currentGrupoSelecionado = ""
              private var currentTipo = "LIVE"
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  txtId = findViewById(R.id.txtId)
                  txtStatus = findViewById(R.id.txtStatus)
                  layoutAtivacao = findViewById(R.id.layoutAtivacao)
                  layoutMenu = findViewById(R.id.layoutMenu)
                  layoutLista = findViewById(R.id.layoutLista)
                  layoutPlayer = findViewById(R.id.layoutPlayer)
                  txtTituloLista = findViewById(R.id.txtTituloLista)
                  listView = findViewById(R.id.listView)
                  videoView = findViewById(R.id.videoView)
                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!
                  txtId.text = deviceId
                  findViewById<Button>(R.id.btnCopiar).setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID", deviceId))
                  }
                  findViewById<Button>(R.id.btnVerificar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnCanais).setOnClickListener { abrirCategorias("LIVE") }
                  findViewById<Button>(R.id.btnFilmes).setOnClickListener { abrirCategorias("MOVIES") }
                  findViewById<Button>(R.id.btnSeries).setOnClickListener { abrirCategorias("SERIES") }
                  findViewById<Button>(R.id.btnAjustes).setOnClickListener { abrirAjustes() }
                  findViewById<Button>(R.id.btnSair).setOnClickListener { finish() }
                  findViewById<Button>(R.id.btnVoltarLista).setOnClickListener { voltar() }
                  findViewById<Button>(R.id.btnVoltarPlayer).setOnClickListener { voltar() }
                  listView.setOnItemClickListener { _, _, pos, _ ->
                      if (txtTituloLista.text.contains("Categoria")) {
                          abrirCanaisDoGrupo(currentGruposKeys[pos])
                      } else {
                          val canal = getCanaisAtuais()[pos]
                          videoView.setVideoPath(canal.url)
                          videoView.start()
                          layoutLista.visibility=View.GONE
                          layoutPlayer.visibility=View.VISIBLE
                          findViewById<TextView>(R.id.txtTocando).text=canal.nome
                      }
                  }
              }
              fun verificarAtivacao(){
                  thread{
                      try{
                          val url = "https://supplay.online/api/check.php?device_id=$deviceId"
                          val conn = URL(url).openConnection() as HttpURLConnection
                          val resp = conn.inputStream.bufferedReader().use{it.readText()}
                          runOnUiThread{
                              val json = JSONObject(resp)
                              if(json.optString("status")=="active"){
                                  val pl = json.optString("playlist").replace("\\/", "/")
                                  carregarM3U(pl)
                              }
                          }
                      }catch(e:Exception){}
                  }
              }
              fun carregarM3U(link: String){
                  thread{
                      val conn = URL(link).openConnection() as HttpURLConnection
                      val txt = conn.inputStream.bufferedReader().use{it.readText()}
                      var nome=""; var grupo=""
                      for(l in txt.lines()){
                          if(l.startsWith("#EXTINF")){
                              nome = if(l.contains(",")) l.substringAfterLast(",") else "Canal"
                              grupo = Regex("group-title=\"([^\"]+)\"").find(l)?.groupValues?.get(1) ?: "Sem"
                          } else if(l.startsWith("http")){
                              val tipo = if(grupo.lowercase().contains("filme")) "MOVIES" else if(grupo.lowercase().contains("serie")) "SERIES" else "LIVE"
                              val c = Canal(nome,l,grupo,tipo)
                              val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                              if(!mapa.containsKey(grupo)) mapa[grupo]=mutableListOf()
                              mapa[grupo]?.add(c)
                              nome=""; grupo=""
                          }
                      }
                      runOnUiThread{ layoutAtivacao.visibility=View.GONE; layoutMenu.visibility=View.VISIBLE }
                  }
              }
              fun abrirCategorias(tipo: String){
                  currentTipo=tipo
                  val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  currentGruposKeys=mapa.keys.sorted()
                  txtTituloLista.text="Categorias $tipo"
                  listView.adapter=ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys)
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
              }
              fun abrirCanaisDoGrupo(g: String){
                  currentGrupoSelecionado=g
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  val lista=mapa[g]?: emptyList()
                  txtTituloLista.text=g
                  listView.adapter=ArrayAdapter(this, android.R.layout.simple_list_item_1, lista.map{it.nome})
              }
              fun getCanaisAtuais(): List<Canal>{
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  return mapa[currentGrupoSelecionado]?: emptyList()
              }
              fun abrirAjustes(){
                  txtTituloLista.text="Ajustes"
                  listView.adapter=ArrayAdapter(this, android.R.layout.simple_list_item_1, listOf("Limpar"))
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
              }
              fun voltar(){
                  if(layoutPlayer.visibility==View.VISIBLE){ videoView.stopPlayback(); layoutPlayer.visibility=View.GONE; layoutLista.visibility=View.VISIBLE; return }
                  layoutLista.visibility=View.GONE; layoutMenu.visibility=View.VISIBLE
              }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#070F2A">
              <LinearLayout android:id="@+id/layoutAtivacao" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp">
                  <TextView android:text="Super Play" android:textColor="#FFF" android:textSize="28sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <TextView android:id="@+id/txtId" android:text="XXXX" android:textColor="#00FF88" android:textSize="32sp" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                  <Button android:id="@+id/btnCopiar" android:text="Copiar" android:layout_width="match_parent" android:layout_height="48dp"/>
                  <Button android:id="@+id/btnVerificar" android:text="Verificar" android:layout_width="match_parent" android:layout_height="48dp" android:layout_marginTop="8dp"/>
                  <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="..." android:textColor="#888" android:gravity="center"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutMenu" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:padding="16dp">
                  <Button android:id="@+id/btnCanais" android:text="Canais" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnFilmes" android:text="Filmes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnSeries" android:text="Series" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:layout_margin="4dp"/>
                  <Button android:id="@+id/btnAjustes" android:text="Ajustes" android:layout_width="match_parent" android:layout_height="48dp"/>
                  <Button android:id="@+id/btnSair" android:text="Sair" android:layout_width="match_parent" android:layout_height="48dp"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutLista" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone">
                  <Button android:id="@+id/btnVoltarLista" android:text="Voltar" android:layout_width="wrap_content" android:layout_height="36dp"/>
                  <TextView android:id="@+id/txtTituloLista" android:text="Categorias" android:textColor="#FFF" android:layout_width="match_parent" android:layout_height="wrap_content" android:gravity="center"/>
                  <ListView android:id="@+id/listView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutPlayer" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:background="#000">
                  <Button android:id="@+id/btnVoltarPlayer" android:text="Voltar" android:layout_width="wrap_content" android:layout_height="32dp"/>
                  <TextView android:id="@+id/txtTocando" android:text="Tocando" android:textColor="#FFF" android:layout_width="match_parent" android:layout_height="wrap_content"/>
                  <VideoView android:id="@+id/videoView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
          </FrameLayout>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Super Play" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.superplay.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 16
                  versionName "16.0-VIDEO-VIEW"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {}
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle 7.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6
      - name: Build APK v16 VIDEO-VIEW
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          find . -name "*.apk" -type f -ls
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v16-VIDEO-VIEW, path: "**/*.apk" }
