name: Build Super Play
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Prepare
        run: |
          set -x
          ls -la
          echo "--- Procurando ZIP ---"
          find . -maxdepth 2 -name "*.zip" -print
          for f in *.zip; do
            [ -e "$f" ] || continue
            echo "Unzipping $f"
            unzip -o "$f" -d .
          done
          echo "--- Depois do unzip ---"
          ls -la
          echo "--- Procurando gradlew ---"
          find . -type f -name "gradlew" -print
          # Se gradlew estiver dentro de alguma subpasta, traz tudo pra raiz
          GRADLEW_PATH=$(find . -type f -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR=$(dirname "$GRADLEW_PATH")
            echo "Projeto encontrado em: $DIR"
            if [ "$DIR" != "." ]; then
              cp -rf "$DIR"/* . 2>/dev/null || true
              cp -rf "$DIR"/.* . 2>/dev/null || true
            fi
          fi
          ls -la
          chmod +x gradlew || true
          ls -la app || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-APK
          path: app/build/outputs/apk/debug/*.apk
