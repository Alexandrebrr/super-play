name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Play v37 MINIMAL TEST
        run: |
          rm -rf app build .gradle gradle
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="48dp" android:height="48dp" android:viewportWidth="48" android:viewportHeight="48">
            <path android:fillColor="#000" android:pathData="M0,0h48v48h-48z"/>
          </vector>
          XML
          cat > gradle.properties <<'PROP'
          android.useAndroidX=true
          android.enableJetifier=true
          PROP
          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.TextView
          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "Super Play v37 TESTE - Se compilar o ambiente esta OK"
                  tv.textSize = 24f
                  setContentView(tv)
              }
          }
          KT
          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <TextView xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:text="Teste"/>
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Super Play" android:icon="@drawable/ic_launcher">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.superplay.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 37
                  versionName "37.0-TESTE"
              }
              buildTypes { release { minifyEnabled false } }
          }
          GRADLE
          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build APK v37 MINIMAL TEST
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          find . -name "*.apk" -type f -ls
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v37-MINIMAL-TEST, path: "**/*.apk" }
