name: Build Super Play
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if zip was uploaded
        run: |
          ls -la
          for z in *.zip **/*.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d.
            fi
          done
          rm -f *.zip || true
          if [ -d "PACOTE-2-APP-FINAL-CORRIGIDO" ]; then
            cp -r PACOTE-2-APP-FINAL-CORRIGIDO/*. || true
            cp -r PACOTE-2-APP-FINAL-CORRIGIDO/.github. || true
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK and AAB
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
           ./gradlew assembleDebug bundleRelease --stacktrace
          else
            wget -q https://services.gradle.org/distributions/gradle-8.6-bin.zip
            unzip -q gradle-8.6-bin.zip
           ./gradle-8.6/bin/gradle wrapper --gradle-version 8.6
            chmod +x gradlew
           ./gradlew assembleDebug bundleRelease --stacktrace
          fi

      - name: Upload APK AAB
        uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-APK-AAB-FINAL
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
