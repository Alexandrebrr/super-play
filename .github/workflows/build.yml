name: Build Super Play
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix Project Structure
        run: |
          echo "=== Estrutura atual ==="
          ls -la

          # Cria pastas padrão do Android
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout

          # Move os arquivos soltos para o lugar certo (se existirem)
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f activity_main.xml ] && mv activity_main.xml app/src/main/res/layout/ || true
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/com/superplay/app/ || true
          [ -f Constants.kt ] && mv Constants.kt app/src/main/java/com/superplay/app/ || true
          [ -f DeviceManager.kt ] && mv DeviceManager.kt app/src/main/java/com/superplay/app/ || true
          [ -f build.gradle ] && mv build.gradle app/build.gradle || true

          # Cria settings.gradle e build.gradle raiz se não existir
          [! -f settings.gradle ] && echo "include ':app'" > settings.gradle || true
          [! -f build.gradle ] && echo "" > build.gradle || true

          echo "=== Nova estrutura ==="
          find. -type f | head -n 50

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          chmod +x gradlew || true
          if [ -f gradlew ]; then
           ./gradlew assembleDebug --stacktrace
          else
            curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q gradle.zip
           ./gradle-8.7/bin/gradle wrapper --gradle-version 8.7
            chmod +x gradlew
           ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
