
name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Play v19 MEDIA3 FIX CURL
        run: |
          rm -rf app build .gradle gradle gradle.zip
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="512dp" android:height="512dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#050E2A" android:pathData="M0,0h512v512h-512z"/>
            <path android:strokeColor="#00FFC8" android:strokeWidth="10" android:pathData="M45,45h422a45,45 0 0 1 45,45v332a45,45 0 0 1 -45,45h-422a45,45 0 0 1 -45,-45v-332a45,45 0 0 1 45,-45z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M100,150h312a30,30 0 0 1 30,30v150a30,30 0 0 1 -30,30h-312a30,30 0 0 1 -30,-30v-150a30,30 0 0 1 30,-30z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M170,380l172,0l-12,38h-148z"/>
            <path android:fillColor="#00FF88" android:pathData="M215,195l0,120l100,-60z"/>
