name: Build Super Play
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and Prepare
        run: |
          ls -la
          unzip -o "PACOTE-2-APP-FINAL-CORRIGIDO (1).zip" -d . || unzip -o PACOTE-*.zip -d . || true
          rm -rf .github
          ls -la
          find . -maxdepth 4 -name "gradlew" -print
          # Se o projeto veio dentro de uma pasta, move tudo pra raiz
          for d in */; do
            if [ -f "$d/gradlew" ] || [ -f "$d/app/build.gradle" ]; then
              echo "Found project in $d"
              cp -rf $d/. .
              break
            fi
          done
          ls -la
          chmod +x gradlew || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-APK
          path: app/build/outputs/apk/debug/*.apk
