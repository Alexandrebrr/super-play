name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Super Play COMPLETO com PLAYER
        run: |
          rm -rf app build .gradle gradle gradle.zip
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout

          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.content.ClipboardManager
          import android.content.Context
          import android.widget.MediaController
          import android.widget.VideoView
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          import org.json.JSONObject

          class MainActivity : Activity() {
              private var deviceId: String = ""
              private var canaisNomes = mutableListOf<String>()
              private var canaisUrls = mutableListOf<String>()
              private lateinit var txtId: TextView
              private lateinit var txtStatus: TextView
              private lateinit var btnVerificar: Button
              private lateinit var listCanais: ListView
              private lateinit var videoView: VideoView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  txtId = findViewById(R.id.txtId)
                  txtStatus = findViewById(R.id.txtStatus)
                  btnVerificar = findViewById(R.id.btnVerificar)
                  listCanais = findViewById(R.id.listCanais)
                  videoView = findViewById(R.id.videoView)
                  val btnCopiar = findViewById<Button>(R.id.btnCopiar)

                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!

                  txtId.text = deviceId
                  txtStatus.text = "Acesse supplay.online - ID: $deviceId"

                  val mediaController = MediaController(this)
                  mediaController.setAnchorView(videoView)
                  videoView.setMediaController(mediaController)

                  btnCopiar.setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID TV", deviceId))
                      Toast.makeText(this, "ID copiado", Toast.LENGTH_SHORT).show()
                  }

                  btnVerificar.setOnClickListener { verificarAtivacao() }

                  listCanais.setOnItemClickListener { _, _, pos, _ ->
                      if (pos < canaisUrls.size) {
                          val url = canaisUrls[pos]
                          val nome = canaisNomes[pos]
                          txtStatus.text = "Tocando: $nome"
                          try {
                              videoView.setVideoPath(url)
                              videoView.requestFocus()
                              videoView.start()
                          } catch (e: Exception) {
                              Toast.makeText(this, "Erro: ${e.message}", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }
              }

              fun verificarAtivacao() {
                  txtStatus.text = "Verificando $deviceId..."
                  btnVerificar.isEnabled = false
                  thread {
                      try {
                          val fullUrl = "https://supplay.online/api/check.php?device_id=" + deviceId
                          val conn = URL(fullUrl).openConnection() as HttpURLConnection
                          conn.connectTimeout = 10000
                          conn.readTimeout = 10000
                          conn.requestMethod = "GET"
                          val resp = try { conn.inputStream.bufferedReader().use { it.readText() } } catch (e: Exception) { conn.errorStream?.bufferedReader()?.use { it.readText() } ?: "" }
                          runOnUiThread {
                              try {
                                  val json = JSONObject(resp)
                                  val status = json.optString("status")
                                  if (status == "active") {
                                      val playlist = json.optString("playlist").replace("\\/", "/")
                                      if (playlist.isNotEmpty() && playlist.startsWith("http")) {
                                          txtStatus.text = "Ativo! Baixando canais..."
                                          carregarM3U(playlist)
                                      } else {
                                          txtStatus.text = "Ativo mas playlist vazia"
                                          btnVerificar.isEnabled = true
                                      }
                                  } else {
                                      txtStatus.text = "Nao ativado. Ative em supplay.online com ID $deviceId"
                                      btnVerificar.isEnabled = true
                                  }
                              } catch (e: Exception) {
                                  txtStatus.text = "Nao ativado. Ative em supplay.online ID $deviceId"
                                  btnVerificar.isEnabled = true
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread { txtStatus.text = "Erro: ${e.message}"; btnVerificar.isEnabled = true }
                      }
                  }
              }

              fun carregarM3U(linkM3U: String) {
                  thread {
                      try {
                          val conn = URL(linkM3U).openConnection() as HttpURLConnection
                          conn.connectTimeout = 15000
                          conn.readTimeout = 15000
                          val conteudo = conn.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                          val nomes = mutableListOf<String>()
                          val urls = mutableListOf<String>()
                          val linhas = conteudo.lines()
                          var nomeAtual = ""
                          for (linha in linhas) {
                              val l = linha.trim()
                              if (l.startsWith("#EXTINF")) {
                                  nomeAtual = if (l.contains(",")) l.substringAfterLast(",").trim() else "Canal"
                                  if (nomeAtual.isEmpty()) nomeAtual = "Canal"
                              } else if (l.isNotEmpty() && !l.startsWith("#") && (l.startsWith("http") || l.startsWith("rtmp"))) {
                                  if (nomeAtual.isEmpty()) nomeAtual = "Canal"
                                  nomes.add(nomeAtual)
                                  urls.add(l)
                                  nomeAtual = ""
                              }
                          }
                          runOnUiThread {
                              canaisNomes = nomes
                              canaisUrls = urls
                              if (nomes.isEmpty()) {
                                  txtStatus.text = "Lista vazia"
                              } else {
                                  txtStatus.text = "${nomes.size} canais - Toque para assistir"
                                  val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, nomes)
                                  listCanais.adapter = adapter
                              }
                              btnVerificar.isEnabled = true
                          }
                      } catch (e: Exception) {
                          runOnUiThread { txtStatus.text = "Erro ao baixar lista: ${e.message}"; btnVerificar.isEnabled = true }
                      }
                  }
              }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:background="#000000"
              android:padding="12dp">
              <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Super Play" android:textColor="#FFFFFF" android:textSize="22sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="12dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="#1C1C1E" android:padding="12dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="ID DA SUA TV" android:textColor="#888888" android:textSize="11sp"/>
                  <TextView android:id="@+id/txtId" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="A1B2-C3D4" android:textColor="#00FF88" android:textSize="32sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="8dp"/>
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="www.supplay.online/ativar" android:textColor="#FFFFFF" android:textSize="12sp" android:textStyle="bold" android:gravity="center" android:layout_marginBottom="10dp"/>
                  <Button android:id="@+id/btnCopiar" android:layout_width="match_parent" android:layout_height="42dp" android:text="COPIAR ID" android:layout_marginBottom="6dp"/>
                  <Button android:id="@+id/btnVerificar" android:layout_width="match_parent" android:layout_height="48dp" android:text="VERIFICAR ATIVAÇÃO" android:backgroundTint="#00FF88" android:textColor="#000000" android:textStyle="bold"/>
              </LinearLayout>
              <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Aguardando..." android:textColor="#888888" android:textSize="11sp" android:gravity="center" android:layout_marginTop="8dp" android:layout_marginBottom="6dp"/>
              <VideoView android:id="@+id/videoView" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:background="#000000" android:layout_marginBottom="6dp"/>
              <ListView android:id="@+id/listCanais" android:layout_width="match_parent" android:layout_height="140dp" android:background="#151515"/>
          </LinearLayout>
          XML

          cat > app/src/main/AndroidManifest.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:label="Super Play" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          XML

          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdkVersion 33
              defaultConfig {
                  applicationId "com.superplay.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 5
                  versionName "5.0-COM-PLAYER"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          }
          GRADLE

          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build APK COM PLAYER
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.0-bin.zip
          unzip -q gradle.zip
          ./gradle-8.0/bin/gradle assembleDebug --stacktrace
          find . -name "*.apk" -type f -ls

      - uses: actions/upload-artifact@v4
        with:
          name: SuperPlay-COM-PLAYER
          path: "**/*.apk"
