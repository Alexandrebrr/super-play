name: build
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Super Play v33 FULL BUSCA FIX
        run: |
          rm -rf app build .gradle gradle
          mkdir -p app/src/main/java/com/superplay/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="512dp" android:height="512dp" android:viewportWidth="512" android:viewportHeight="512">
            <path android:fillColor="#050E2A" android:pathData="M0,0h512v512h-512z"/>
            <path android:strokeColor="#00FFC8" android:strokeWidth="12" android:pathData="M40,40h432v432h-432z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M100,150h312v180h-312z"/>
            <path android:fillColor="#00FF88" android:pathData="M215,190l0,120l100,-60z"/>
          </vector>
          XML
          cat > app/src/main/res/drawable/bg_space.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <gradient android:angle="135" android:startColor="#070F2A" android:endColor="#0A1931" android:type="linear"/>
          </shape>
          XML
          cat > gradle.properties <<'PROP'
          android.useAndroidX=true
          android.enableJetifier=true
          PROP
          cat > app/src/main/java/com/superplay/app/MainActivity.kt <<'KT'
          package com.superplay.app
          import android.app.Activity
          import android.os.Bundle
          import android.widget.*
          import android.view.View
          import android.content.ClipboardManager
          import android.content.Context
          import java.net.URL
          import java.net.HttpURLConnection
          import kotlin.concurrent.thread
          import org.json.JSONObject
          import android.graphics.BitmapFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.common.MediaItem
          import androidx.media3.ui.PlayerView
          data class Canal(val nome: String, val url: String, val grupo: String, val tipo: String, val logo: String, val epgId: String)
          class MainActivity : Activity() {
              private var deviceId = ""
              private var exoPlayer: ExoPlayer? = null
              private var previewPlayer: ExoPlayer? = null
              private lateinit var txtId: TextView
              private lateinit var txtStatus: TextView
              private lateinit var txtStatusMenu: TextView
              private lateinit var layoutAtivacao: LinearLayout
              private lateinit var layoutMenu: LinearLayout
              private lateinit var layoutLista: LinearLayout
              private lateinit var layoutPlayer: LinearLayout
              private lateinit var layoutDetalhe: LinearLayout
              private lateinit var layoutPreview: LinearLayout
              private lateinit var txtTituloLista: TextView
              private lateinit var listView: ListView
              private lateinit var playerView: PlayerView
              private lateinit var previewView: PlayerView
              private lateinit var txtEpgPreview: TextView
              private lateinit var imgCapa: ImageView
              private lateinit var txtTituloFilme: TextView
              private lateinit var txtSinopse: TextView
              private lateinit var edtBusca: EditText
              private var liveGrupos = linkedMapOf<String, MutableList<Canal>>()
              private var moviesGrupos = linkedMapOf<String, MutableList<Canal>>()
              private var seriesGrupos = linkedMapOf<String, MutableList<Canal>>()
              private var liveOrder = mutableListOf<String>()
              private var moviesOrder = mutableListOf<String>()
              private var seriesOrder = mutableListOf<String>()
              private var currentGruposKeys = listOf<String>()
              private var currentGrupoSelecionado = ""
              private var currentTipo = "LIVE"
              private var lastPlaylistUrl = ""
              private var lastClickPos = -1
              private var lastClickTime = 0L
              private var currentCanalPreview: Canal? = null
              private var listaCanaisAtualCompleta = listOf<Canal>()
              private var listaCategoriasAtualCompleta = listOf<String>()
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  txtId = findViewById(R.id.txtId)
                  txtStatus = findViewById(R.id.txtStatus)
                  txtStatusMenu = findViewById(R.id.txtStatusMenu)
                  layoutAtivacao = findViewById(R.id.layoutAtivacao)
                  layoutMenu = findViewById(R.id.layoutMenu)
                  layoutLista = findViewById(R.id.layoutLista)
                  layoutPlayer = findViewById(R.id.layoutPlayer)
                  layoutDetalhe = findViewById(R.id.layoutDetalhe)
                  layoutPreview = findViewById(R.id.layoutPreview)
                  txtTituloLista = findViewById(R.id.txtTituloLista)
                  listView = findViewById(R.id.listView)
                  playerView = findViewById(R.id.playerView)
                  previewView = findViewById(R.id.previewView)
                  txtEpgPreview = findViewById(R.id.txtEpgPreview)
                  imgCapa = findViewById(R.id.imgCapa)
                  txtTituloFilme = findViewById(R.id.txtTituloFilme)
                  txtSinopse = findViewById(R.id.txtSinopse)
                  edtBusca = findViewById(R.id.edtBusca)
                  exoPlayer = ExoPlayer.Builder(this).build()
                  previewPlayer = ExoPlayer.Builder(this).build()
                  playerView.player = exoPlayer
                  previewView.player = previewPlayer
                  val prefs = getSharedPreferences("superplay", MODE_PRIVATE)
                  var id = prefs.getString("device_id", null)
                  if (id == null) {
                      val chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"
                      val rnd = java.util.Random()
                      fun parte(n: Int): String { return (1..n).map { chars[rnd.nextInt(chars.length)] }.joinToString("") }
                      id = "${parte(4)}-${parte(4)}"
                      prefs.edit().putString("device_id", id).apply()
                  }
                  deviceId = id!!
                  txtId.text = deviceId
                  lastPlaylistUrl = prefs.getString("playlist_url", "") ?: ""
                  findViewById<Button>(R.id.btnCopiar).setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(android.content.ClipData.newPlainText("ID", deviceId))
                      Toast.makeText(this, "ID copiado", Toast.LENGTH_SHORT).show()
                  }
                  findViewById<Button>(R.id.btnVerificar).setOnClickListener { verificarAtivacao() }
                  findViewById<Button>(R.id.btnEntrar).setOnClickListener { abrirMenuDireto() }
                  findViewById<Button>(R.id.btnCanais).setOnClickListener { abrirCategorias("LIVE") }
                  findViewById<Button>(R.id.btnFilmes).setOnClickListener { abrirCategorias("MOVIES") }
                  findViewById<Button>(R.id.btnSeries).setOnClickListener { abrirCategorias("SERIES") }
                  findViewById<Button>(R.id.btnAjustes).setOnClickListener { abrirAjustes() }
                  findViewById<Button>(R.id.btnAtualizar).setOnClickListener {
                      if(lastPlaylistUrl.isNotEmpty()) carregarM3U(lastPlaylistUrl) else verificarAtivacao()
                  }
                  findViewById<Button>(R.id.btnSair).setOnClickListener { voltarParaAtivacao() }
                  findViewById<Button>(R.id.btnVoltarLista).setOnClickListener { voltar() }
                  findViewById<Button>(R.id.btnVoltarPlayer).setOnClickListener { minimizarPlayer() }
                  findViewById<Button>(R.id.btnVoltarDetalhe).setOnClickListener { layoutDetalhe.visibility=View.GONE; layoutLista.visibility=View.VISIBLE }
                  findViewById<Button>(R.id.btnPlayFilme).setOnClickListener { currentCanalPreview?.let { playFullscreen(it) } }
                  findViewById<Button>(R.id.btnTelaCheia).setOnClickListener { currentCanalPreview?.let { playFullscreen(it) } }
                  findViewById<Button>(R.id.btnPlayPreview).setOnClickListener { currentCanalPreview?.let { playFullscreen(it) } }
                  findViewById<Button>(R.id.btnLimparBusca).setOnClickListener { edtBusca.setText("") }
                  edtBusca.addTextChangedListener(object : android.text.TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) {}
                      override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {}
                      override fun afterTextChanged(s: android.text.Editable?) {
                          val q = s.toString()
                          filtrarBusca(q)
                      }
                  })
                  playerView.setOnClickListener {
                      val top = findViewById<LinearLayout>(R.id.topBarPlayer)
                      if(top.visibility==View.VISIBLE){
                          top.visibility=View.GONE
                      } else {
                          top.visibility=View.VISIBLE
                          top.postDelayed({ if(layoutPlayer.visibility==View.VISIBLE) top.visibility=View.GONE }, 3000)
                      }
                      window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
                  }
                  listView.setOnItemClickListener { _, _, pos, _ ->
                      val now = System.currentTimeMillis()
                      if (txtTituloLista.text.toString().startsWith("Categorias") || currentTipo=="AJUSTES") {
                          if(currentTipo=="AJUSTES"){
                              if(pos==5){
                                  prefs.edit().remove("playlist_url").apply()
                                  liveGrupos.clear(); moviesGrupos.clear(); seriesGrupos.clear()
                                  liveOrder.clear(); moviesOrder.clear(); seriesOrder.clear()
                                  Toast.makeText(this,"Cache limpo",Toast.LENGTH_SHORT).show()
                                  voltarParaAtivacao()
                              }
                              return@setOnItemClickListener
                          }
                          if(pos < currentGruposKeys.size) abrirCanaisDoGrupo(currentGruposKeys[pos])
                      } else {
                          val lista = getListaFiltradaAtual()
                          if(pos >= lista.size) return@setOnItemClickListener
                          val canal = lista[pos]
                          if(lastClickPos==pos && now - lastClickTime < 800){
                              playFullscreen(canal)
                          } else {
                              if(currentTipo=="LIVE") mostrarPreview(canal) else mostrarDetalheFilme(canal)
                          }
                          lastClickPos=pos
                          lastClickTime=now
                      }
                  }
                  if(lastPlaylistUrl.isNotEmpty()){
                      abrirMenuDireto()
                      carregarM3U(lastPlaylistUrl)
                  }
              }
              fun getAttr(line: String, attr: String): String {
                  val idx = line.indexOf(attr + "=")
                  if(idx==-1) return ""
                  var start = idx + attr.length + 1
                  if(start >= line.length) return ""
                  val q = line[start]
                  if(q == '"' || q.code == 39){
                      start++
                      val end = line.indexOf(q, start)
                      if(end!=-1) return line.substring(start, end)
                  } else {
                      var end = line.indexOf(' ', start)
                      if(end==-1) end=line.length
                      return line.substring(start, end)
                  }
                  return ""
              }
              fun filtrarBusca(query: String){
                  val q = query.trim().lowercase()
                  if(q.isEmpty()){
                      if(txtTituloLista.text.toString().startsWith("Categorias")){
                          currentGruposKeys = listaCategoriasAtualCompleta
                          val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                          listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys.map{it + " (" + (mapa[it]?.size ?: 0).toString() + ")"})
                          txtTituloLista.text = "Categorias - " + currentGruposKeys.size + " (TUDO)"
                      } else {
                          val lista = listaCanaisAtualCompleta
                          listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, lista.map{it.nome})
                          txtTituloLista.text = currentGrupoSelecionado + " - " + lista.size + " (TUDO)"
                      }
                      return
                  }
                  if(txtTituloLista.text.toString().startsWith("Categorias")){
                      val filtrado = listaCategoriasAtualCompleta.filter{ it.lowercase().contains(q) }
                      currentGruposKeys = filtrado
                      val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                      listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, filtrado.map{it + " (" + (mapa[it]?.size ?: 0).toString() + ")"})
                      txtTituloLista.text = "Busca: " + query + " - " + filtrado.size
                  } else {
                      val filtrado = listaCanaisAtualCompleta.filter{ it.nome.lowercase().contains(q) || it.grupo.lowercase().contains(q) }
                      listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, filtrado.map{it.nome})
                      txtTituloLista.text = "Busca: " + query + " - " + filtrado.size
                  }
              }
              fun getListaFiltradaAtual(): List<Canal>{
                  val q = edtBusca.text.toString().trim().lowercase()
                  if(q.isEmpty()) return listaCanaisAtualCompleta
                  return listaCanaisAtualCompleta.filter{ it.nome.lowercase().contains(q) || it.grupo.lowercase().contains(q) }
              }
              fun voltarParaAtivacao(){
                  layoutMenu.visibility = View.GONE
                  layoutLista.visibility = View.GONE
                  layoutPlayer.visibility = View.GONE
                  layoutDetalhe.visibility = View.GONE
                  layoutAtivacao.visibility = View.VISIBLE
                  exoPlayer?.stop()
                  previewPlayer?.stop()
                  window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
              }
              fun abrirMenuDireto(){
                  layoutAtivacao.visibility = View.GONE
                  layoutMenu.visibility = View.VISIBLE
                  layoutLista.visibility = View.GONE
                  layoutPlayer.visibility = View.GONE
                  layoutDetalhe.visibility = View.GONE
                  txtStatusMenu.text = "LIVE:" + liveGrupos.values.sumOf{it.size} + " FIL:" + moviesGrupos.values.sumOf{it.size} + " SER:" + seriesGrupos.values.sumOf{it.size}
              }
              fun verificarAtivacao(){
                  txtStatus.text = "Verificando..."
                  thread{
                      try{
                          val url = "https://supplay.online/api/check.php?device_id=$deviceId"
                          val conn = URL(url).openConnection() as HttpURLConnection
                          conn.connectTimeout=12000; conn.readTimeout=12000
                          val resp = conn.inputStream.bufferedReader().use{it.readText()}
                          runOnUiThread{
                              try{
                                  val json = JSONObject(resp)
                                  if(json.optString("status")=="active"){
                                      var pl = json.optString("playlist","")
                                      if(pl.isEmpty()) pl = json.optString("url","")
                                      if(pl.isNotEmpty()){
                                          lastPlaylistUrl = pl
                                          getSharedPreferences("superplay", MODE_PRIVATE).edit().putString("playlist_url", pl).apply()
                                          abrirMenuDireto()
                                          carregarM3U(pl)
                                      } else {
                                          txtStatus.text="Ativo sem link"
                                          abrirMenuDireto()
                                      }
                                  } else {
                                      txtStatus.text="Nao ativo"
                                  }
                              }catch(e:Exception){ txtStatus.text="Erro JSON" }
                          }
                      }catch(e:Exception){ runOnUiThread{ txtStatus.text="Erro rede" } }
                  }
              }
              fun carregarM3U(link: String){
                  if(link.isBlank()){
                      txtStatusMenu.text="Link vazio"
                      return
                  }
                  txtStatusMenu.text = "Carregando a lista... aguarde"
                  txtStatus.text = "Carregando a lista... aguarde"
                  thread{
                      var total=0
                      var reader: java.io.BufferedReader? = null
                      try{
                          val conn = URL(link).openConnection() as HttpURLConnection
                          conn.connectTimeout=20000
                          conn.readTimeout=60000
                          conn.setRequestProperty("User-Agent","VLC/3.0.20")
                          conn.instanceFollowRedirects=true
                          val code = conn.responseCode
                          if(code!=200) throw Exception("HTTP $code")
                          reader = conn.inputStream.bufferedReader()
                          liveGrupos.clear(); moviesGrupos.clear(); seriesGrupos.clear()
                          liveOrder.clear(); moviesOrder.clear(); seriesOrder.clear()
                          var nome="Canal"
                          var grupo="Sem Categoria"
                          var logo=""
                          var epgId=""
                          var line: String?
                          while(true){
                              try{ line = reader.readLine() ?: break } catch(e:Exception){ break }
                              val trimmed = line!!.trim()
                              if(trimmed.isEmpty()) continue
                              if(trimmed.startsWith("<!DOCTYPE") || trimmed.startsWith("<html")) throw Exception("HTML nao M3U")
                              if(trimmed.startsWith("#EXTINF")){
                                  try{
                                      nome = if(trimmed.contains(",")) trimmed.substringAfterLast(",").trim() else "Canal"
                                      if(nome.length>120) nome=nome.take(120)
                                      grupo = getAttr(trimmed, "group-title")
                                      if(grupo.isEmpty()) grupo="Sem Categoria"
                                      logo = getAttr(trimmed, "tvg-logo")
                                      epgId = getAttr(trimmed, "tvg-id")
                                      if(epgId.isEmpty()) epgId = getAttr(trimmed, "tvg-name")
                                  } catch(e:Exception){}
                              } else if(trimmed.startsWith("http://") || trimmed.startsWith("https://")){
                                  try{
                                      total++
                                      val gl = grupo.lowercase()
                                      val ll = trimmed.lowercase()
                                      val tipo = when{
                                          gl.contains("filme") || gl.contains("movie") || ll.contains("/movie/") -> "MOVIES"
                                          gl.contains("serie") || ll.contains("/series/") -> "SERIES"
                                          else -> "LIVE"
                                      }
                                      val canal = Canal(nome, trimmed, grupo, tipo, logo, epgId)
                                      val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                                      val order = when(tipo){"MOVIES"->moviesOrder;"SERIES"->seriesOrder;else->liveOrder}
                                      if(!mapa.containsKey(grupo)){
                                          mapa[grupo]=mutableListOf()
                                          order.add(grupo)
                                      }
                                      mapa[grupo]?.add(canal)
                                      if(total % 500 == 0){
                                          val t=total
                                          runOnUiThread{ if(!isFinishing) txtStatusMenu.text="Carregando a lista... " + t + " canais..." }
                                      }
                                  } catch(e:Exception){}
                                  nome="Canal"; grupo="Sem Categoria"; logo=""; epgId=""
                              }
                          }
                          reader.close()
                          runOnUiThread{
                              if(isFinishing) return@runOnUiThread
                              val lc = liveGrupos.values.sumOf{it.size}
                              val mc = moviesGrupos.values.sumOf{it.size}
                              val sc = seriesGrupos.values.sumOf{it.size}
                              txtStatusMenu.text="Carregando a lista... OK! LIVE:" + lc + " FIL:" + mc + " SER:" + sc + " TOTAL:" + total
                              txtStatus.text="TUDO carregado " + total
                              Toast.makeText(this, "TUDO " + total + " canais", Toast.LENGTH_LONG).show()
                              if(layoutAtivacao.visibility==View.VISIBLE) abrirMenuDireto()
                          }
                      } catch(e:Exception){
                          try{ reader?.close() } catch(ex:Exception){}
                          runOnUiThread{ txtStatusMenu.text="Erro: " + e.message }
                      }
                  }
              }
              fun abrirCategorias(tipo: String){
                  currentTipo=tipo
                  edtBusca.setText("")
                  val mapa = when(tipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  val order = when(tipo){"MOVIES"->moviesOrder;"SERIES"->seriesOrder;else->liveOrder}
                  if(mapa.isEmpty()){
                      Toast.makeText(this,"Vazio " + tipo,Toast.LENGTH_LONG).show()
                      return
                  }
                  currentGruposKeys = if(order.isNotEmpty()) order else mapa.keys.toList()
                  listaCategoriasAtualCompleta = currentGruposKeys
                  txtTituloLista.text="Categorias - " + currentGruposKeys.size + " (TUDO)"
                  listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys.map{it + " (" + (mapa[it]?.size ?: 0).toString() + ")"})
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
                  layoutPreview.visibility=View.GONE
              }
              fun abrirCanaisDoGrupo(g: String){
                  currentGrupoSelecionado=g
                  edtBusca.setText("")
                  val mapa = when(currentTipo){"MOVIES"->moviesGrupos;"SERIES"->seriesGrupos;else->liveGrupos}
                  val lista=mapa[g]?: emptyList()
                  listaCanaisAtualCompleta = lista
                  txtTituloLista.text=g + " - " + lista.size + " (TUDO)"
                  listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, lista.map{it.nome})
              }
              fun mostrarPreview(canal: Canal){
                  currentCanalPreview = canal
                  layoutPreview.visibility = View.VISIBLE
                  txtEpgPreview.text = canal.nome + " | Grupo: " + canal.grupo
                  try{
                      val item = MediaItem.fromUri(canal.url)
                      previewPlayer?.setMediaItem(item)
                      previewPlayer?.prepare()
                      previewPlayer?.playWhenReady=true
                  }catch(e:Exception){}
              }
              fun mostrarDetalheFilme(canal: Canal){
                  currentCanalPreview = canal
                  layoutLista.visibility=View.GONE
                  layoutDetalhe.visibility=View.VISIBLE
                  txtTituloFilme.text = canal.nome
                  txtSinopse.text = "Sinopse: " + canal.nome + " - Grupo " + canal.grupo
                  if(canal.logo.isNotEmpty()){
                      thread{
                          try{
                              val conn = URL(canal.logo).openConnection() as HttpURLConnection
                              conn.connectTimeout=8000
                              val bmp = BitmapFactory.decodeStream(conn.inputStream)
                              runOnUiThread{ imgCapa.setImageBitmap(bmp) }
                          }catch(e:Exception){}
                      }
                  }
              }
              fun playFullscreen(canal: Canal){
                  currentCanalPreview = canal
                  layoutLista.visibility=View.GONE
                  layoutDetalhe.visibility=View.GONE
                  layoutMenu.visibility=View.GONE
                  layoutPreview.visibility=View.GONE
                  layoutPlayer.visibility=View.VISIBLE
                  window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = (View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or View.SYSTEM_UI_FLAG_FULLSCREEN or View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION)
                  findViewById<LinearLayout>(R.id.topBarPlayer).visibility=View.GONE
                  findViewById<TextView>(R.id.txtTocando).text=canal.nome
                  previewPlayer?.stop()
                  try{
                      val item = MediaItem.fromUri(canal.url)
                      exoPlayer?.setMediaItem(item)
                      exoPlayer?.prepare()
                      exoPlayer?.playWhenReady=true
                  }catch(e:Exception){}
              }
              fun minimizarPlayer(){
                  exoPlayer?.stop()
                  window.clearFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.decorView.systemUiVisibility = View.SYSTEM_UI_FLAG_VISIBLE
                  findViewById<LinearLayout>(R.id.topBarPlayer).visibility=View.VISIBLE
                  layoutPlayer.visibility=View.GONE
                  if(currentTipo=="LIVE"){
                      layoutLista.visibility=View.VISIBLE
                      layoutPreview.visibility=View.VISIBLE
                  } else {
                      layoutDetalhe.visibility=View.VISIBLE
                  }
              }
              fun abrirAjustes(){
                  currentTipo="AJUSTES"
                  edtBusca.setText("")
                  val lc = liveGrupos.values.sumOf{it.size}
                  val mc = moviesGrupos.values.sumOf{it.size}
                  val sc = seriesGrupos.values.sumOf{it.size}
                  currentGruposKeys=listOf("ID " + deviceId,"LIVE " + lc,"FILMES " + mc,"SERIES " + sc,"URL " + lastPlaylistUrl.take(50),"Limpar e voltar")
                  listaCategoriasAtualCompleta=currentGruposKeys
                  txtTituloLista.text="Ajustes v33"
                  listView.adapter = ArrayAdapter(this, android.R.layout.simple_list_item_1, currentGruposKeys)
                  layoutMenu.visibility=View.GONE
                  layoutLista.visibility=View.VISIBLE
                  layoutPreview.visibility=View.GONE
              }
              fun voltar(){
                  if(layoutPlayer.visibility==View.VISIBLE){ minimizarPlayer(); return }
                  if(layoutDetalhe.visibility==View.VISIBLE){ layoutDetalhe.visibility=View.GONE; layoutLista.visibility=View.VISIBLE; return }
                  if(layoutLista.visibility==View.VISIBLE){ layoutLista.visibility=View.GONE; layoutMenu.visibility=View.VISIBLE; return }
              }
              override fun onBackPressed() { voltar() }
              override fun onDestroy() { super.onDestroy(); exoPlayer?.release(); previewPlayer?.release() }
          }
          KT
          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@drawable/bg_space">
              <LinearLayout android:id="@+id/layoutAtivacao" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:gravity="center" android:padding="20dp">
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Super Play" android:textColor="#FFF" android:textSize="28sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/txtId" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="XXXX-XXXX" android:textColor="#00FF88" android:textSize="34sp" android:textStyle="bold"/>
                      <TextView android:id="@+id/txtStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Carregando a lista..." android:textColor="#888" android:gravity="center" android:layout_marginTop="12dp"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:gravity="center" android:padding="16dp">
                      <Button android:id="@+id/btnCopiar" android:layout_width="match_parent" android:layout_height="48dp" android:text="COPIAR ID"/>
                      <Button android:id="@+id/btnVerificar" android:layout_width="match_parent" android:layout_height="52dp" android:text="VERIFICAR" android:backgroundTint="#00FF88" android:textColor="#000" android:layout_marginTop="8dp"/>
                      <Button android:id="@+id/btnEntrar" android:layout_width="match_parent" android:layout_height="48dp" android:text="ENTRAR" android:backgroundTint="#1A3A8A" android:layout_marginTop="8dp"/>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutMenu" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:padding="12dp">
                  <TextView android:id="@+id/txtStatusMenu" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Carregando a lista..." android:textColor="#00FF88" android:textSize="12sp" android:gravity="center"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal">
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="2" android:orientation="vertical">
                          <Button android:id="@+id/btnCanais" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Canais Ao Vivo" android:backgroundTint="#1A3A8A" android:layout_margin="4dp"/>
                          <Button android:id="@+id/btnFilmes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Filmes" android:layout_margin="4dp"/>
                          <Button android:id="@+id/btnSeries" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Series" android:layout_margin="4dp"/>
                      </LinearLayout>
                      <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical">
                          <Button android:id="@+id/btnAjustes" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Ajustes" android:layout_margin="3dp"/>
                          <Button android:id="@+id/btnAtualizar" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Atualizar Lista" android:layout_margin="3dp"/>
                          <Button android:id="@+id/btnSair" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:text="Sair p/ Codigo" android:layout_margin="3dp"/>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutLista" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:background="#0A1931" android:padding="8dp">
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                      <Button android:id="@+id/btnVoltarLista" android:layout_width="wrap_content" android:layout_height="36dp" android:text="Voltar"/>
                      <TextView android:id="@+id/txtTituloLista" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Categorias" android:textColor="#FFF" android:gravity="center"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:background="#1A2A4A" android:padding="4dp" android:layout_marginTop="6dp">
                      <EditText android:id="@+id/edtBusca" android:layout_width="0dp" android:layout_height="40dp" android:layout_weight="1" android:hint="Buscar canal, filme, serie..." android:textColor="#FFF" android:hintTextColor="#888" android:background="#0F2240" android:padding="8dp"/>
                      <Button android:id="@+id/btnLimparBusca" android:layout_width="wrap_content" android:layout_height="40dp" android:text="X"/>
                  </LinearLayout>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="horizontal" android:layout_marginTop="6dp">
                      <ListView android:id="@+id/listView" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:background="#0F2240"/>
                      <LinearLayout android:id="@+id/layoutPreview" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical" android:visibility="gone" android:background="#111" android:padding="6dp">
                          <androidx.media3.ui.PlayerView android:id="@+id/previewView" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1"/>
                          <TextView android:id="@+id/txtEpgPreview" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="EPG" android:textColor="#FFF" android:textSize="11sp" android:padding="4dp"/>
                          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal">
                              <Button android:id="@+id/btnPlayPreview" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:text="Assistir" android:backgroundTint="#00FF88" android:layout_margin="2dp"/>
                              <Button android:id="@+id/btnTelaCheia" android:layout_width="0dp" android:layout_height="36dp" android:layout_weight="1" android:text="Tela Cheia" android:layout_margin="2dp"/>
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutDetalhe" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="horizontal" android:visibility="gone" android:background="#0A1931" android:padding="12dp">
                  <ImageView android:id="@+id/imgCapa" android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:scaleType="centerCrop" android:background="#222"/>
                  <LinearLayout android:layout_width="0dp" android:layout_height="match_parent" android:layout_weight="1" android:orientation="vertical" android:padding="12dp">
                      <Button android:id="@+id/btnVoltarDetalhe" android:layout_width="wrap_content" android:layout_height="32dp" android:text="Voltar"/>
                      <TextView android:id="@+id/txtTituloFilme" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Titulo" android:textColor="#FFF" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="8dp"/>
                      <ScrollView android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:layout_marginTop="8dp">
                          <TextView android:id="@+id/txtSinopse" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Sinopse..." android:textColor="#CCC" android:textSize="13sp"/>
                      </ScrollView>
                      <Button android:id="@+id/btnPlayFilme" android:layout_width="match_parent" android:layout_height="50dp" android:text="Assistir Filme/Serie" android:backgroundTint="#00FF88" android:textColor="#000" android:layout_marginTop="8dp"/>
                  </LinearLayout>
              </LinearLayout>
              <LinearLayout android:id="@+id/layoutPlayer" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:visibility="gone" android:background="#000">
                  <LinearLayout android:id="@+id/topBarPlayer" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="6dp" android:background="#111">
                      <Button android:id="@+id/btnVoltarPlayer" android:layout_width="wrap_content" android:layout_height="32dp" android:text="Voltar" android:visibility="gone"/>
                      <TextView android:id="@+id/txtTocando" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Tocando" android:textColor="#FFF" android:gravity="center"/>
                  </LinearLayout>
                  <androidx.media3.ui.PlayerView android:id="@+id/playerView" android:layout_width="match_parent" android:layout_height="match_parent"/>
              </LinearLayout>
          </FrameLayout>
          XML
          cat > app/src/main/AndroidManifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:allowBackup="true" android:largeHeap="true" android:hardwareAccelerated="true" android:label="Super Play" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen" android:screenOrientation="landscape">
                      <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
                  </activity>
              </application>
          </manifest>
          XML
          cat > app/build.gradle <<'GRADLE'
          apply plugin: 'com.android.application'
          apply plugin: 'org.jetbrains.kotlin.android'
          android {
              namespace 'com.superplay.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.superplay.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 33
                  versionName "33.0-FULL-BUSCA-FIX"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-common:1.2.1'
          }
          GRADLE
          cat > build.gradle <<'GRADLE'
          buildscript {
              ext.kotlin_version = '1.9.10'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Build APK v33 FULL BUSCA FIX
        run: |
          gradle assembleDebug --stacktrace --no-daemon
          find . -name "*.apk" -type f -ls
      - uses: actions/upload-artifact@v4
        with: { name: SuperPlay-v33-FULL-BUSCA-FIX, path: "**/*.apk" }
